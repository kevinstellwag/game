<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Party Games 🎉</title>
<link rel="stylesheet" href="/css/main.css">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">
  <!-- HOME SCREEN -->
  <div id="home-screen" class="screen active">
    <div class="home-bg"></div>
    <div class="home-content">
      <div class="logo-area">
        <div class="logo-emoji">🎮</div>
        <h1 class="logo-title">PARTY<span>GAMES</span></h1>
        <p class="logo-sub">Your friends are waiting. Unfortunately.</p>
      </div>
      <div class="home-buttons">
        <button class="btn-big btn-create" onclick="showCreateRoom()">
          <span class="btn-icon">🚀</span>
          <span>Create Room</span>
        </button>
        <button class="btn-big btn-join" onclick="showJoinRoom()">
          <span class="btn-icon">🔑</span>
          <span>Join Room</span>
        </button>
      </div>
      <div id="create-form" class="form-box hidden">
        <h2>Create a Room</h2>
        <input id="create-name" type="text" placeholder="Your name (make it funny)" maxlength="20">
        <label>Pick a game to start with:</label>
        <div class="game-picker">
          <div class="game-option selected" data-game="cah" onclick="selectGame(this)">
            <span>🃏</span><span>Cards Against Humanity</span>
          </div>
          <div class="game-option" data-game="poker" onclick="selectGame(this)">
            <span>♠️</span><span>Poker</span>
          </div>
          <div class="game-option" data-game="monopoly" onclick="selectGame(this)">
            <span>🏦</span><span>Monopoly</span>
          </div>
        </div>
        <button class="btn-action" onclick="createRoom()">Let's GO!</button>
        <button class="btn-back" onclick="hideAllForms()">← Back</button>
      </div>
      <div id="join-form" class="form-box hidden">
        <h2>Join a Room</h2>
        <input id="join-name" type="text" placeholder="Your name" maxlength="20">
        <input id="join-code" type="text" placeholder="Room code (e.g. XK7P2Q)" maxlength="6" style="text-transform:uppercase">
        <button class="btn-action" onclick="joinRoom()">Enter!</button>
        <button class="btn-back" onclick="hideAllForms()">← Back</button>
      </div>
    </div>
  </div>

  <!-- GAME ROOM -->
  <div id="room-screen" class="screen">
    <div id="room-header">
      <div class="room-info">
        <span class="room-code-display">Room: <strong id="room-code-text">------</strong></span>
        <button class="btn-copy" onclick="copyCode()">📋 Copy</button>
      </div>
      <div class="room-tabs">
        <button class="tab-btn active" onclick="showTab('game-tab')">🎮 Game</button>
        <button class="tab-btn" onclick="showTab('chat-tab')">💬 Chat <span id="chat-badge" class="badge hidden">!</span></button>
        <button class="tab-btn" onclick="showTab('players-tab')">👥 Players</button>
        <button id="settings-tab-btn" class="tab-btn host-only" onclick="showTab('settings-tab')">⚙️ Settings</button>
      </div>
    </div>

    <div id="game-tab" class="tab-content active">
      <div id="game-container">
        <!-- Game content loaded here -->
      </div>
    </div>

    <div id="chat-tab" class="tab-content">
      <div class="chat-container">
        <div id="chat-messages"></div>
        <div class="chat-input-row">
          <input id="chat-input" type="text" placeholder="Type something dumb..." maxlength="200" onkeydown="if(event.key==='Enter')sendChat()">
          <button onclick="sendChat()">Send</button>
        </div>
      </div>
    </div>

    <div id="players-tab" class="tab-content">
      <div id="players-list" class="players-list"></div>
    </div>

    <div id="settings-tab" class="tab-content">
      <div class="settings-panel">
        <h3>Game Settings</h3>
        <label>Win at X points (CAH):</label>
        <input type="number" id="setting-maxpoints" value="7" min="1" max="50" onchange="updateSettings()">
        <h3>Switch Game</h3>
        <div class="game-picker">
          <div class="game-option" data-game="cah" onclick="switchGame('cah')">🃏 Cards Against Humanity</div>
          <div class="game-option" data-game="poker" onclick="switchGame('poker')">♠️ Poker</div>
          <div class="game-option" data-game="monopoly" onclick="switchGame('monopoly')">🏦 Monopoly</div>
        </div>
        <h3>Custom Cards (CAH)</h3>
        <label>Add Black Card (fill in the blank with ___)</label>
        <textarea id="custom-black" placeholder="My therapist says I have an unhealthy obsession with ___." rows="2"></textarea>
        <button class="btn-action-sm" onclick="addCustomCard('black')">Add Black Card</button>
        <label>Add White Card (answer)</label>
        <textarea id="custom-white" placeholder="Getting blocked by my own mom." rows="2"></textarea>
        <button class="btn-action-sm" onclick="addCustomCard('white')">Add White Card</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="/js/app.js"></script>
<script src="/js/cah.js"></script>
<script src="/js/poker.js"></script>
<script src="/js/monopoly.js"></script>
</body>
</html>
