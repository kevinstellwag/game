<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PartyGames 🎮</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:Nunito,sans-serif;background:#0d0d1a;color:#f0f0ff;overflow:hidden}
:root{--bg:#0d0d1a;--bg2:#16162a;--card:#1e1e35;--card2:#262642;--acc:#ff6b6b;--acc2:#ffd93d;--acc3:#6bcb77;--acc4:#4d96ff;--txt:#f0f0ff;--txt2:#8888aa;--brd:rgba(255,255,255,0.08);--r:12px}
input,textarea,button{font-family:Nunito,sans-serif;font-size:inherit}
.hidden{display:none!important}
/* UTILS */
.screen{display:none;height:100vh;width:100vw;position:absolute;top:0;left:0}
.screen.active{display:flex}
/* AUTH */
#s-auth{background:radial-gradient(ellipse at 20% 50%,#2d1b69,transparent 55%),radial-gradient(ellipse at 80% 20%,#1a3a5c,transparent 55%),var(--bg);align-items:center;justify-content:center}
.auth-wrap{width:100%;max-width:380px;padding:1.5rem}
.auth-logo{text-align:center;margin-bottom:1.75rem}
.auth-logo-icon{font-size:3.5rem;display:block;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.auth-logo h1{font-family:Bangers,cursive;font-size:2.8rem;letter-spacing:4px;text-shadow:0 0 30px rgba(255,107,107,0.5)}
.auth-logo h1 span{color:var(--acc2)}
.auth-logo p{color:var(--txt2);font-style:italic;font-size:0.85rem;margin-top:0.2rem}
.auth-box{background:var(--card);border-radius:var(--r);padding:1.5rem;border:1px solid var(--brd)}
.auth-box h2{font-family:Bangers,cursive;font-size:1.7rem;letter-spacing:2px;color:var(--acc2);margin-bottom:1rem;text-align:center}
.fld{margin-bottom:0.7rem}
.fld label{display:block;font-size:0.7rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--txt2);margin-bottom:0.25rem}
.fld input{width:100%;padding:0.7rem 0.85rem;background:var(--bg);border:2px solid var(--brd);border-radius:9px;color:var(--txt);font-size:0.95rem;transition:border-color 0.2s}
.fld input:focus{outline:none;border-color:var(--acc4)}
.btn-prim{width:100%;padding:0.8rem;background:linear-gradient(135deg,var(--acc),#ee0979);border:none;border-radius:9px;color:#fff;font-weight:900;font-size:1rem;cursor:pointer;margin-top:0.2rem;transition:all 0.2s}
.btn-prim:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-prim:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.auth-switch{text-align:center;margin-top:0.85rem;font-size:0.82rem;color:var(--txt2)}
.auth-switch button{background:none;border:none;color:var(--acc4);font-weight:800;cursor:pointer}
.auth-err{background:rgba(255,107,107,0.1);border:1px solid rgba(255,107,107,0.3);border-radius:8px;padding:0.55rem 0.8rem;color:var(--acc);font-size:0.82rem;margin-bottom:0.7rem;display:none}
.auth-err.show{display:block}
.color-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all 0.15s;display:inline-block}
.color-dot:hover,.color-dot.sel{border-color:#fff;transform:scale(1.15)}
/* APP LAYOUT */
#s-app{flex-direction:row}
/* SIDEBAR */
.sidebar{width:62px;background:var(--bg2);border-right:1px solid var(--brd);display:flex;flex-direction:column;align-items:center;padding:0.6rem 0;gap:0.2rem;flex-shrink:0}
.sb-logo{font-size:1.5rem;margin-bottom:0.4rem;cursor:default}
.sb-btn{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.25rem;cursor:pointer;border:none;background:transparent;color:var(--txt2);transition:all 0.15s;position:relative}
.sb-btn:hover{background:var(--card);color:var(--txt)}
.sb-btn.act{background:var(--card2);color:var(--acc2)}
.sb-badge{position:absolute;top:3px;right:3px;min-width:14px;height:14px;border-radius:7px;background:var(--acc);color:#fff;font-size:0.5rem;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 3px}
.sb-div{width:30px;height:1px;background:var(--brd);margin:0.2rem 0}
.sb-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:0.85rem;cursor:pointer;border:2px solid transparent;transition:border-color 0.15s;margin-top:auto;margin-bottom:0.2rem}
.sb-av:hover{border-color:var(--acc2)}
/* MAIN */
.main{flex:1;overflow:hidden;position:relative}
/* PANELS */
.panel{display:none;height:100%;width:100%;flex-direction:column;background:var(--bg);overflow:hidden}
.panel.act{display:flex}
.ph{padding:0.85rem 1.1rem;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:0.6rem;flex-shrink:0;background:var(--bg2)}
.ph-title{font-family:Bangers,cursive;font-size:1.35rem;letter-spacing:2px;color:var(--acc2);flex:1}
.ph-sub{font-size:0.72rem;color:var(--txt2)}
/* HOME */
.home-body{flex:1;overflow-y:auto;padding:1.1rem}
.hw{background:linear-gradient(135deg,var(--card),var(--card2));border-radius:var(--r);padding:1.1rem;margin-bottom:1rem;border:1px solid var(--brd);display:flex;align-items:center;gap:0.9rem}
.hw-av{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:900;flex-shrink:0;border:2px solid var(--acc2)}
.hw-h2{font-family:Bangers,cursive;font-size:1.4rem;letter-spacing:2px}
.hw-sub{color:var(--txt2);font-size:0.75rem;margin-top:2px}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem;margin-bottom:1rem}
.hsc{background:var(--card);border-radius:10px;padding:0.8rem 0.4rem;text-align:center;border:1px solid var(--brd)}
.hsc-v{font-family:Bangers,cursive;font-size:1.7rem;color:var(--acc2);line-height:1}
.hsc-l{font-size:0.6rem;color:var(--txt2);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.hsec{font-family:Bangers,cursive;font-size:1.1rem;letter-spacing:2px;color:var(--txt2);margin:0.6rem 0 0.4rem}
.lb-row{display:flex;align-items:center;gap:0.55rem;padding:0.45rem 0.7rem;background:var(--card);border-radius:9px;border:1px solid var(--brd);margin-bottom:0.3rem}
.lb-rk{font-family:Bangers,cursive;font-size:1.2rem;width:26px;text-align:center;flex-shrink:0}
.lb-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:0.75rem;flex-shrink:0}
.lb-nm{flex:1;font-weight:800;font-size:0.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-sc{font-family:Bangers,cursive;font-size:1.2rem;color:var(--acc3)}
.lb-me{border-color:var(--acc2);background:rgba(255,217,61,0.06)}
/* CHAT PANEL */
#p-chat{flex-direction:row}
/* Conversations list */
.convos{width:230px;background:var(--bg2);border-right:1px solid var(--brd);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.convos-hdr{padding:0.7rem 0.9rem;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.convos-title{font-family:Bangers,cursive;font-size:1.1rem;letter-spacing:2px;color:var(--acc2)}
.convos-add{background:none;border:none;color:var(--acc3);font-size:1.2rem;cursor:pointer;padding:2px}
.convos-body{flex:1;overflow-y:auto;padding:0.35rem}
.conv-item{display:flex;align-items:center;gap:0.45rem;padding:0.5rem 0.55rem;border-radius:9px;cursor:pointer;transition:all 0.15s;border:2px solid transparent;margin-bottom:2px;position:relative}
.conv-item:hover{background:var(--card)}
.conv-item.act{background:var(--card2);border-color:var(--acc2)}
.conv-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:0.85rem;flex-shrink:0;position:relative}
.online-dot{position:absolute;bottom:0;right:0;width:9px;height:9px;border-radius:50%;background:var(--acc3);border:2px solid var(--bg2)}
.conv-info{flex:1;min-width:0}
.conv-name{font-weight:800;font-size:0.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-last{font-size:0.65rem;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-badge{min-width:16px;height:16px;border-radius:8px;background:var(--acc);color:#fff;font-size:0.55rem;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 3px;flex-shrink:0}
.convos-footer{padding:0.5rem;border-top:1px solid var(--brd);flex-shrink:0}
.btn-join-grp{width:100%;padding:0.4rem;background:var(--bg);border:1px solid var(--brd);border-radius:8px;color:var(--txt2);font-size:0.73rem;cursor:pointer;transition:all 0.15s}
.btn-join-grp:hover{border-color:var(--acc4);color:var(--acc4)}
/* Chat area */
.chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.chat-hdr{padding:0.7rem 0.9rem;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:0.6rem;flex-shrink:0;background:var(--bg2)}
.chat-hdr-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:0.8rem;flex-shrink:0}
.chat-hdr-name{font-weight:900;font-size:0.95rem;flex:1}
.chat-hdr-sub{font-size:0.68rem;color:var(--txt2)}
.btn-start-game{padding:0.38rem 0.75rem;background:linear-gradient(135deg,#9933ff,#4d00cc);border:none;border-radius:8px;color:#fff;font-weight:900;font-size:0.75rem;cursor:pointer;transition:all 0.15s;flex-shrink:0}
.btn-start-game:hover{filter:brightness(1.15)}
.chat-msgs{flex:1;overflow-y:auto;padding:0.65rem 0.9rem;display:flex;flex-direction:column;gap:3px}
.chat-msgs::-webkit-scrollbar{width:3px}
.chat-msgs::-webkit-scrollbar-thumb{background:var(--brd);border-radius:2px}
.cmsg{display:flex;gap:0.45rem;align-items:flex-start;padding:1px 0}
.cmsg-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:0.65rem;flex-shrink:0;margin-top:2px}
.cmsg-body{flex:1;min-width:0}
.cmsg-meta{display:flex;align-items:baseline;gap:0.35rem;margin-bottom:1px}
.cmsg-name{font-size:0.7rem;font-weight:800}
.cmsg-time{font-size:0.6rem;color:var(--txt2)}
.cmsg-text{font-size:0.87rem;line-height:1.4;word-break:break-word;color:var(--txt)}
.csys{font-size:0.7rem;color:var(--txt2);font-style:italic;text-align:center;padding:3px 0}
/* Game invite message in chat */
.ginv{background:linear-gradient(135deg,rgba(77,0,204,0.25),rgba(153,51,255,0.15));border:2px solid #7722cc;border-radius:11px;padding:0.7rem 0.9rem;margin:3px 0;display:flex;align-items:center;gap:0.65rem}
.ginv-ico{font-size:1.5rem;flex-shrink:0}
.ginv-info{flex:1}
.ginv-title{font-weight:900;font-size:0.87rem}
.ginv-sub{font-size:0.68rem;color:var(--txt2);margin-top:1px}
.ginv-btn{padding:0.38rem 0.8rem;background:linear-gradient(135deg,#9933ff,#6600cc);border:none;border-radius:7px;color:#fff;font-weight:900;font-size:0.76rem;cursor:pointer;flex-shrink:0;white-space:nowrap}
.ginv-btn:hover{filter:brightness(1.15)}
.ginv-active{border-color:var(--acc3)}
/* Game in chat — overlay */
.game-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--bg);display:flex;flex-direction:column;z-index:100}
.game-ol-hdr{padding:0.7rem 1rem;background:var(--card);border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:0.65rem;flex-shrink:0}
.game-ol-title{font-family:Bangers,cursive;font-size:1.2rem;letter-spacing:2px;color:var(--acc2);flex:1}
.game-ol-players{font-size:0.72rem;color:var(--txt2)}
.btn-leave-game{padding:0.38rem 0.75rem;background:var(--card2);border:2px solid var(--brd);border-radius:8px;color:var(--txt2);font-weight:700;font-size:0.78rem;cursor:pointer;transition:all 0.15s}
.btn-leave-game:hover{border-color:var(--acc);color:var(--acc)}
.game-ol-body{flex:1;overflow:hidden;display:flex}
.game-area{flex:1;overflow-y:auto;padding:0.9rem}
.game-side-chat{width:240px;border-left:1px solid var(--brd);display:flex;flex-direction:column;background:var(--card);flex-shrink:0}
.game-side-chat-msgs{flex:1;overflow-y:auto;padding:0.45rem}
.game-chat-inp{padding:0.4rem;border-top:1px solid var(--brd);display:flex;gap:0.35rem;flex-shrink:0}
.game-chat-inp input{flex:1;padding:0.4rem 0.55rem;background:var(--bg);border:2px solid var(--brd);border-radius:7px;color:var(--txt);font-size:0.82rem}
.game-chat-inp input:focus{outline:none;border-color:var(--acc4)}
.game-chat-inp button{padding:0.4rem 0.6rem;background:var(--acc4);border:none;border-radius:7px;color:#fff;font-weight:900;cursor:pointer}
.chat-inp-area{padding:0.65rem 0.9rem;border-top:1px solid var(--brd);display:flex;gap:0.45rem;flex-shrink:0;background:var(--bg2)}
.chat-inp{flex:1;padding:0.6rem 0.85rem;background:var(--card);border:2px solid var(--brd);border-radius:11px;color:var(--txt);font-size:0.88rem;transition:border-color 0.2s}
.chat-inp:focus{outline:none;border-color:var(--acc4)}
.chat-send{padding:0.6rem 0.9rem;background:linear-gradient(135deg,var(--acc4),#2356d4);border:none;border-radius:11px;color:#fff;font-weight:900;cursor:pointer;transition:all 0.15s}
.chat-send:hover{filter:brightness(1.1)}
/* FRIENDS panel */
#p-friends{background:var(--bg)}
.friends-body{flex:1;overflow-y:auto;padding:1rem}
.friend-row{display:flex;align-items:center;gap:0.65rem;padding:0.6rem 0.85rem;background:var(--card);border-radius:10px;border:1px solid var(--brd);margin-bottom:0.35rem}
.friend-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:0.95rem;flex-shrink:0;position:relative}
.friend-name{font-weight:800;flex:1}
.friend-status{font-size:0.7rem;color:var(--txt2)}
.btn-accept{padding:0.3rem 0.65rem;background:linear-gradient(135deg,var(--acc3),#228b22);border:none;border-radius:7px;color:#111;font-weight:900;font-size:0.73rem;cursor:pointer}
.btn-reject{padding:0.3rem 0.65rem;background:var(--card2);border:1px solid var(--brd);border-radius:7px;color:var(--txt2);font-weight:700;font-size:0.73rem;cursor:pointer;margin-left:4px}
.btn-remove{padding:0.3rem 0.65rem;background:rgba(255,107,107,0.1);border:1px solid rgba(255,107,107,0.25);border-radius:7px;color:var(--acc);font-size:0.73rem;font-weight:700;cursor:pointer;transition:all 0.15s}
.btn-remove:hover{background:var(--acc);color:#fff}
.friend-pending-badge{background:rgba(255,217,61,0.15);color:var(--acc2);font-size:0.65rem;font-weight:900;padding:1px 5px;border-radius:4px;margin-left:4px}
/* PROFILE */
#p-profile{background:var(--bg)}
.profile-body{flex:1;overflow-y:auto}
.profile-wrap{max-width:500px;margin:0 auto;padding:1.25rem 1rem}
.prof-hdr{display:flex;align-items:center;gap:0.9rem;margin-bottom:1.25rem;background:var(--card);border-radius:var(--r);padding:1.1rem;border:1px solid var(--brd)}
.prof-av{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:900;flex-shrink:0;border:3px solid var(--acc2)}
.prof-name{font-family:Bangers,cursive;font-size:1.9rem;letter-spacing:2px}
.prof-sub{color:var(--txt2);font-size:0.75rem;margin-top:2px}
.sec-title{font-family:Bangers,cursive;font-size:1.15rem;letter-spacing:2px;color:var(--acc2);margin:0 0 0.65rem}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem;margin-bottom:1.25rem}
.sc{background:var(--card);border-radius:10px;padding:0.8rem 0.4rem;text-align:center;border:1px solid var(--brd)}
.sc-v{font-family:Bangers,cursive;font-size:1.6rem;color:var(--acc2);line-height:1}
.sc-l{font-size:0.6rem;color:var(--txt2);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:0.5rem;margin-bottom:1.25rem}
.ach{background:var(--card);border-radius:10px;padding:0.65rem;text-align:center;border:2px solid var(--brd)}
.ach.ok{border-color:var(--acc2);background:rgba(255,217,61,0.06)}
.ach.no{opacity:0.3;filter:grayscale(0.9)}
.ach-ico{font-size:1.6rem;margin-bottom:3px;line-height:1}
.ach-nm{font-weight:900;font-size:0.7rem;line-height:1.2}
.ach-dc{font-size:0.58rem;color:var(--txt2);margin-top:2px;line-height:1.3}
.btn-logout{padding:0.6rem 1.1rem;background:var(--card2);border:2px solid var(--brd);border-radius:9px;color:var(--txt2);font-weight:700;cursor:pointer;transition:all 0.15s}
.btn-logout:hover{border-color:var(--acc);color:var(--acc)}
/* ADMIN */
#p-admin{background:var(--bg)}
.admin-body{flex:1;overflow-y:auto}
.admin-wrap{max-width:680px;margin:0 auto;padding:1.25rem 1rem}
.adm-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem;margin-bottom:1.25rem}
.adm-sc{background:var(--card);border-radius:10px;padding:0.9rem;text-align:center;border:1px solid var(--brd)}
.adm-sc-v{font-family:Bangers,cursive;font-size:1.9rem;color:var(--acc2);line-height:1}
.adm-sc-l{font-size:0.62rem;color:var(--txt2);text-transform:uppercase;letter-spacing:1px;margin-top:3px}
.adm-tbl{width:100%;border-collapse:collapse;margin-bottom:1.25rem;font-size:0.8rem}
.adm-tbl th{text-align:left;padding:0.45rem 0.65rem;background:var(--card2);color:var(--txt2);font-size:0.68rem;text-transform:uppercase;letter-spacing:1px}
.adm-tbl td{padding:0.5rem 0.65rem;border-bottom:1px solid var(--brd)}
.adm-tbl tr:hover td{background:var(--card)}
.btn-del{padding:0.28rem 0.6rem;background:rgba(255,107,107,0.12);border:1px solid rgba(255,107,107,0.28);border-radius:5px;color:var(--acc);font-size:0.7rem;font-weight:700;cursor:pointer;transition:all 0.15s}
.btn-del:hover{background:var(--acc);color:#fff}
.btn-rst{padding:0.28rem 0.6rem;background:var(--card2);border:1px solid var(--brd);border-radius:5px;color:var(--txt2);font-size:0.7rem;font-weight:700;cursor:pointer;margin-left:3px;transition:all 0.15s}
.btn-rst:hover{border-color:var(--acc4);color:var(--acc4)}
.adm-admin-badge{background:rgba(255,107,107,0.18);color:var(--acc);font-size:0.6rem;font-weight:900;padding:1px 5px;border-radius:4px;margin-left:3px}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:500;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-box{background:var(--card);border-radius:var(--r);padding:1.4rem;max-width:400px;width:100%;border:1px solid var(--brd);box-shadow:0 4px 32px rgba(0,0,0,0.6);animation:pop 0.2s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes pop{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal-box h2{font-family:Bangers,cursive;font-size:1.55rem;letter-spacing:2px;color:var(--acc2);margin-bottom:0.9rem}
.m-fld{margin-bottom:0.65rem}
.m-fld label{display:block;font-size:0.7rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--txt2);margin-bottom:0.25rem}
.m-fld input,.m-fld textarea{width:100%;padding:0.6rem 0.8rem;background:var(--bg);border:2px solid var(--brd);border-radius:9px;color:var(--txt);font-size:0.9rem;transition:border-color 0.2s}
.m-fld input:focus,.m-fld textarea:focus{outline:none;border-color:var(--acc4)}
.m-acts{display:flex;gap:0.45rem;margin-top:0.9rem}
.btn-ok{flex:1;padding:0.65rem;background:linear-gradient(135deg,var(--acc3),#228b22);border:none;border-radius:9px;color:#111;font-weight:900;cursor:pointer}
.btn-cancel{flex:1;padding:0.65rem;background:var(--card2);border:2px solid var(--brd);border-radius:9px;color:var(--txt2);font-weight:700;cursor:pointer}
.code-display{background:var(--bg);border-radius:9px;padding:0.7rem;text-align:center;margin:0.65rem 0;border:2px dashed var(--acc2)}
.code-display strong{font-family:Bangers,cursive;font-size:1.7rem;letter-spacing:4px;color:var(--acc2)}

.game-pick{display:flex;flex-direction:column;gap:0.4rem;margin:0.65rem 0}
.gpick{padding:0.7rem 0.9rem;background:var(--bg2);border:2px solid var(--brd);border-radius:9px;color:var(--txt);font-weight:800;cursor:pointer;text-align:left;transition:all 0.15s;border:2px solid var(--brd)}
.gpick:hover{border-color:var(--acc4)}
.gpick.sel{border-color:var(--acc2);background:rgba(255,217,61,0.09)}
/* GAME LOBBY INSIDE OVERLAY */
.g-lobby-wrap{max-width:540px;margin:0 auto}
.g-lobby-box{background:var(--card);border-radius:var(--r);padding:1.1rem;margin-bottom:0.7rem;border:1px solid var(--brd)}

.lp-row{display:flex;align-items:center;gap:0.65rem;padding:0.55rem 0.8rem;background:var(--card2);border-radius:9px;border:1px solid var(--brd);margin-bottom:0.35rem}
.lp-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:0.9rem;flex-shrink:0}
.lp-name{font-weight:800;flex:1;font-size:0.88rem}
.lp-badge{font-size:0.72rem;color:var(--txt2)}
.host-opts label{font-size:0.7rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--txt2);display:block;margin:0.5rem 0 0.25rem}
.host-opts input[type=number]{width:100%;padding:0.55rem 0.75rem;background:var(--bg);border:2px solid var(--brd);border-radius:8px;color:var(--txt);font-size:0.9rem;margin-bottom:0.3rem}
.host-opts input[type=number]:focus{outline:none;border-color:var(--acc4)}
.host-opts textarea{width:100%;padding:0.55rem 0.75rem;background:var(--bg);border:2px solid var(--brd);border-radius:8px;color:var(--txt);font-size:0.88rem;resize:vertical;margin-bottom:0.3rem}
.g-picker{display:flex;flex-direction:column;gap:0.35rem;margin-bottom:0.55rem}
.g-pick{padding:0.55rem 0.75rem;background:var(--bg2);border-radius:8px;cursor:pointer;border:2px solid var(--brd);font-weight:700;font-size:0.85rem;transition:all 0.15s}
.g-pick:hover{border-color:var(--acc4)}
.g-pick.act{border-color:var(--acc2);background:rgba(255,217,61,0.09)}
.btn-sm{padding:0.45rem 0.8rem;background:var(--card2);border:2px solid var(--brd);border-radius:7px;color:var(--txt);font-weight:700;cursor:pointer;font-size:0.8rem;margin-bottom:0.4rem;transition:all 0.15s}
.btn-sm:hover{border-color:var(--acc4)}
.btn-start{width:100%;padding:0.8rem;background:linear-gradient(135deg,var(--acc),#ee0979);border:none;border-radius:9px;color:#fff;font-weight:900;font-size:0.97rem;cursor:pointer;transition:all 0.2s;margin-top:0.4rem}

.wait-txt{text-align:center;color:var(--txt2);padding:1.2rem;font-style:italic;background:var(--card2);border-radius:9px;border:1px solid var(--brd)}
/* In-game UI (reused from old) */
.black-card{background:#111;border-radius:var(--r);padding:1.4rem;margin-bottom:0.7rem;border:2px solid #333;min-height:110px;position:relative}
.black-card-corner{position:absolute;top:0.7rem;right:0.7rem;font-size:0.62rem;color:#555;font-weight:900;text-transform:uppercase;letter-spacing:2px}

.white-cards-grid,.judge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:0.55rem;margin-bottom:0.7rem}
.wcard{background:#fff;border-radius:11px;padding:0.9rem 0.8rem;cursor:pointer;border:3px solid transparent;transition:all 0.15s;min-height:85px;display:flex;flex-direction:column;justify-content:space-between}
.wcard:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,0.4);border-color:var(--acc2)}
.wcard.selected{border-color:var(--acc3);transform:translateY(-4px)}

.cah-topbar{display:flex;align-items:center;gap:0.65rem;padding:0.55rem 0.8rem;background:var(--card);border-radius:9px;margin-bottom:0.7rem;border:1px solid var(--brd);flex-wrap:wrap}
.cah-round{font-family:Bangers,cursive;font-size:1.15rem;color:var(--acc2)}
.cah-czar{font-size:0.82rem;color:var(--txt2)}
.sc-chips{display:flex;gap:0.35rem;flex-wrap:wrap;margin-left:auto}
.sc-chip{background:var(--card2);padding:0.18rem 0.45rem;border-radius:20px;font-size:0.7rem;font-weight:800}
.czar-box,.submitted-box{text-align:center;padding:1.3rem;background:var(--card);border-radius:var(--r);border:1px solid var(--brd);margin-bottom:0.7rem}
.sub-counter{color:var(--txt2);font-size:0.8rem;margin-top:0.45rem}
.hand-label{font-weight:800;color:var(--txt2);font-size:0.78rem;margin-bottom:0.45rem;text-transform:uppercase;letter-spacing:1px}
.judge-box{text-align:center;padding:0.7rem;background:var(--card2);border-radius:9px;margin-bottom:0.55rem;border:1px solid var(--brd)}
.scores-row{display:flex;align-items:center;gap:0.65rem;padding:0.45rem 0.7rem;background:var(--card);border-radius:8px;margin-bottom:0.3rem;border:2px solid transparent}
.scores-row.winner{border-color:var(--acc2)}
.sc-name{flex:1;font-weight:800;font-size:0.85rem}
.sc-bar-wrap{flex:2;background:var(--bg2);border-radius:4px;height:7px;overflow:hidden}
.sc-bar{height:100%;background:linear-gradient(90deg,var(--acc4),var(--acc3));border-radius:4px;transition:width 0.5s}
.sc-pts{font-family:Bangers,cursive;font-size:1.05rem;color:var(--acc2);width:36px;text-align:right}
.cah-combo-card{background:#1a1a2e;border-radius:9px;padding:0.9rem;margin:0.65rem 0;font-size:1rem;font-weight:700;line-height:1.5;border:2px solid var(--acc2)}
.game-winner{text-align:center;padding:1.3rem;background:linear-gradient(135deg,rgba(255,217,61,0.09),rgba(255,107,107,0.09));border-radius:var(--r);border:2px solid var(--acc2);margin-bottom:0.7rem}

.cah-next-btn{width:100%;padding:0.8rem;background:linear-gradient(135deg,#1a5c1a,var(--acc3));border:none;border-radius:9px;color:#111;font-weight:900;font-size:0.97rem;cursor:pointer;transition:all 0.2s}
.cah-next-btn:hover{transform:translateY(-2px);filter:brightness(1.1)}

/* TOAST */

@keyframes slideInRight{from{transform:translateX(120%)}to{transform:translateX(0)}}
.notif-popup h4{font-family:Bangers,cursive;font-size:1.1rem;letter-spacing:2px;color:var(--acc3);margin-bottom:0.3rem}
.notif-popup p{font-size:0.82rem;color:var(--txt2);margin-bottom:0.7rem;line-height:1.4}

</style>
</head>
<body>

<!-- AUTH -->
<div id="s-auth" class="screen active">
  <div class="auth-wrap">
    <div class="auth-logo">
      <span class="auth-logo-icon">🎮</span>

          <div class="color-dot" style="background:#4d96ff" data-c="#4d96ff" onclick="Auth.pickColor(this)"></div>
          <div class="color-dot" style="background:#ffd93d" data-c="#ffd93d" onclick="Auth.pickColor(this)"></div>
          <div class="color-dot" style="background:#6bcb77" data-c="#6bcb77" onclick="Auth.pickColor(this)"></div>
          <div class="color-dot" style="background:#b44fff" data-c="#b44fff" onclick="Auth.pickColor(this)"></div>
          <div class="color-dot" style="background:#ff9f43" data-c="#ff9f43" onclick="Auth.pickColor(this)"></div>
          <div class="color-dot" style="background:#4ECDC4" data-c="#4ECDC4" onclick="Auth.pickColor(this)"></div>
          <div class="color-dot" style="background:#FF8B94" data-c="#FF8B94" onclick="Auth.pickColor(this)"></div>

      </div>

</div>

<!-- MAIN APP -->
<div id="s-app" class="screen">
  <div class="sidebar">
    <div class="sb-logo">🎮</div>
    <button class="sb-btn act" id="sb-home" onclick="App.panel('home')" title="Home">🏠</button>

    <div class="sb-div"></div>

      <div class="home-body" id="home-body"><div style="text-align:center;padding:3rem;color:var(--txt2)">⏳</div></div>

<!-- MODAL -->
<div class="modal-bg hidden" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modal-box"></div>
</div>

<!-- NOTIFICATION POPUP -->
<div id="notif-popup" style="display:none;position:fixed;top:1rem;right:1rem;background:var(--card);border:2px solid var(--acc3);border-radius:12px;padding:1rem 1.1rem;z-index:9000;max-width:300px;box-shadow:0 6px 24px rgba(0,0,0,0.6)">
  <h4 id="notif-title" style="font-family:Bangers,cursive;font-size:1.1rem;letter-spacing:2px;color:var(--acc3);margin-bottom:0.3rem"></h4>
  <p id="notif-text" style="font-size:0.82rem;color:var(--txt2);margin-bottom:0.7rem;line-height:1.4"></p>
  <div style="display:flex;gap:0.4rem">
    <button id="notif-yes" class="notif-yes" onclick="Notif.accept()">✅ Accepteren</button>
    <button class="notif-no" onclick="Notif.dismiss()">✕</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ========== GLOBALS ==========
let WS=null, wsKA=null;
let myUser=null, myToken=null;
let onlineIds=new Set();
let currentChannel=null, currentChannelName=null, currentChannelColor=null;
let activeGame=null; // { channel, game, isHost, players }
let pendingNotif=null;

const ACHIEVEMENTS=[
  {id:'first_win',ico:'🏆',name:'Eerste Winst',desc:'Win je eerste CAH potje'},
  {id:'five_wins',ico:'🥇',name:'Vijf Winsten',desc:'Win 5 CAH potjes'},
  {id:'czar_boss',ico:'👑',name:'Kaart Tsaar',desc:'Kies 10 winnende kaarten'},
  {id:'degen',ico:'🤮',name:'Volslagen Degen',desc:'Speel 50 rondes CAH'},
  {id:'monopolist',ico:'🏦',name:'Vastgoedmagnaat',desc:'Koop 20 panden'},
  {id:'jailbird',ico:'🔒',name:'Bak-stamgast',desc:'Ga 5x gevangenis in'},
  {id:'banker',ico:'💰',name:'Geldwolf',desc:'Verdien €50.000 Monopoly'},
  {id:'streaker',ico:'🔥',name:'Op Stoom',desc:'Win 3 rondes op rij'},
  {id:'nightowl',ico:'🦉',name:'Nachtuil',desc:'Speel om middernacht'},
  {id:'politician',ico:'🤡',name:'Echte Politicus',desc:'Verlies 3x meer dan je wint'},
];

function esc(s){const d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML;}
let _toastT; function toast(m,d=3000){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(_toastT);_toastT=setTimeout(()=>e.classList.remove('show'),d);}
function showModal(h){document.getElementById('modal-box').innerHTML=h;document.getElementById('modal-bg').classList.remove('hidden');}
function closeModal(){document.getElementById('modal-bg').classList.add('hidden');}
function api(url,opts={}){return fetch(url,{...opts,headers:{'Content-Type':'application/json','Authorization':'Bearer '+(myToken||''),...(opts.headers||{})}});}

// ========== AUTH ==========
const Auth={
  mode:'login', color:'#FF6B6B',
  toggleMode(){
    Auth.mode=Auth.mode==='login'?'register':'login';
    const r=Auth.mode==='register';
    document.getElementById('auth-title').textContent=r?'REGISTREREN':'INLOGGEN';
    document.getElementById('auth-btn').textContent=r?'Account aanmaken':'Inloggen';
    document.getElementById('auth-sw-txt').textContent=r?'Al een account?':'Nog geen account?';
    document.getElementById('auth-sw-btn').textContent=r?'Inloggen':'Registreren';
    document.getElementById('auth-color-fld').classList.toggle('hidden',!r);
    document.getElementById('auth-err').classList.remove('show');
  },
  pickColor(el){document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('sel'));el.classList.add('sel');Auth.color=el.dataset.c;},
  async submit(){
    const u=document.getElementById('a-user').value.trim(), p=document.getElementById('a-pass').value;
    const err=document.getElementById('auth-err'), btn=document.getElementById('auth-btn');
    err.classList.remove('show');
    if(!u||!p){err.textContent='Vul alles in!';err.classList.add('show');return;}
    btn.disabled=true; btn.textContent='⏳...';
    try{
      const url=Auth.mode==='login'?'/api/login':'/api/register';
      const body=Auth.mode==='login'?{username:u,password:p}:{username:u,password:p,color:Auth.color};
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const d=await r.json();
      if(!r.ok){err.textContent=d.error||'Fout';err.classList.add('show');return;}
      myToken=d.token; myUser=d.user;
      localStorage.setItem('pg_token',myToken);
      App.boot();
    }catch{err.textContent='Server niet bereikbaar';err.classList.add('show');}
    finally{btn.disabled=false;btn.textContent=Auth.mode==='login'?'Inloggen':'Account aanmaken';}
  },
  async auto(){
    const t=localStorage.getItem('pg_token');
    if(!t) return false;
    try{
      const r=await fetch('/api/me',{headers:{'Authorization':'Bearer '+t}});
      if(!r.ok){localStorage.removeItem('pg_token');return false;}
      const d=await r.json();
      myToken=t; myUser={id:d.id,username:d.username,color:d.color,isAdmin:d.is_admin};
      return true;
    }catch{return false;}
  },
  logout(){localStorage.removeItem('pg_token');myUser=null;myToken=null;WS?.close();document.querySelector('.screen.active')?.classList.remove('active');document.getElementById('s-auth').classList.add('active');}
};

// ========== WS ==========
function connectWS(){
  if(WS&&WS.readyState<2) return;
  const proto=location.protocol==='https:'?'wss:':'ws:';
  WS=new WebSocket(proto+'//'+location.host);
  WS.onopen=()=>{
    clearInterval(wsKA); wsKA=setInterval(()=>{if(WS&&WS.readyState===1)WS.send(JSON.stringify({type:'PING'}));},15000);
    if(myToken) WS.send(JSON.stringify({type:'WS_AUTH',token:myToken}));
  };
  WS.onmessage=e=>{try{onMsg(JSON.parse(e.data));}catch(err){console.error(err);}};
  WS.onclose=()=>{clearInterval(wsKA); if(myUser) setTimeout(connectWS,3000);};
  WS.onerror=()=>{};
}
function ws(d){if(WS&&WS.readyState===1)WS.send(JSON.stringify(d));}

function onMsg(m){
  if(m.type==='PONG') return;
  if(m.type==='AUTH_OK'){
    onlineIds=new Set(m.onlineIds||[]);
    ws({type:'SUB',channel:'global'});
    // Re-subscribe to current channel
    if(currentChannel) ws({type:'SUB',channel:currentChannel});
    updateOnlineDisplay();
    return;
  }
  if(m.type==='AUTH_ERROR'){toast('⚠️ Sessie verlopen, log opnieuw in');Auth.logout();return;}
  if(m.type==='USER_ONLINE'){onlineIds.add(m.userId);updateOnlineDisplay();refreshConvos();return;}
  if(m.type==='USER_OFFLINE'){onlineIds.delete(m.userId);updateOnlineDisplay();refreshConvos();return;}
  if(m.type==='HISTORY'){
    if(m.channel===currentChannel){
      const el=document.getElementById('chat-msgs');
      if(el){el.innerHTML='';(m.messages||[]).forEach(msg=>renderChatMsg(msg));}
    }
    return;
  }
  if(m.type==='MSG'){
    if(m.message.channel===currentChannel) renderChatMsg(m.message);
    return;
  }
  if(m.type==='FRIEND_REQUEST'){
    Notif.show('👋 Vriendschapsverzoek',esc(m.from.username)+' wil je als vriend toevoegen!','friend_req',{from:m.from});
    updateFriendBadge();
    return;
  }
  if(m.type==='FRIEND_ACCEPTED'){
    toast('✅ '+esc(m.user.username)+' heeft je vriendschapsverzoek geaccepteerd!');
    Friends.load();
    refreshConvos();
    return;
  }
  if(m.type==='GAME_ACTIVE'){
    // Show join button if we're in that channel
    if(m.channel===currentChannel) showGameActiveBar(m);
    return;
  }
  if(m.type==='GAME_JOINED'){
    activeGame={channel:m.channel,game:m.game,isHost:m.isHost,players:m.players};
    showGameOverlay();
    return;
  }
  if(m.type==='GAME_PLAYER_JOINED'){
    if(activeGame){
      activeGame.players.push({id:m.player.id,name:m.player.name,color:m.player.color,isHost:false});
      refreshGameLobby();
    }
    return;
  }
  if(m.type==='GAME_PLAYER_LEFT'){
    if(activeGame){
      activeGame.players=activeGame.players.filter(p=>p.id!==m.userId);
      refreshGameLobby();
    }
    return;
  }
  if(m.type==='GAME_CHAT'){
    addGameChatMsg(m.message);
    return;
  }
  if(m.type==='GAME_STATE'){
    if(activeGame){
      const area=document.getElementById('game-area');
      if(!area) return;
      if(m.game==='cah') CAH.render(m.state);
      else if(m.game==='poker') Poker.render(m.state);
      else if(m.game==='monopoly') Mono.render(m.state);
    }
    return;
  }
  if(m.type==='TOAST'){toast(m.text);return;}
  if(m.type==='ERROR'){toast('❌ '+m.message);return;}
}

    if(!r.ok){toast('❌ '+d.error);return;}
    if(d.status==='accepted') toast('✅ Nu bevriend met '+d.user.username+'!');
    else toast('📨 Vriendschapsverzoek verstuurd naar '+d.user.username+'!');
    if(inp) inp.value='';
    Friends.load(); loadConvos();
  },
  async accept(userId){
    await api('/api/friends/accept',{method:'POST',body:JSON.stringify({userId})});
    toast('✅ Vriend geaccepteerd!');
    Friends.load(); loadConvos(); updateFriendBadge();
  },
  async remove(userId){
    await api('/api/friends/'+userId,{method:'DELETE'});
    Friends.load(); loadConvos();
  },
};

function updateFriendBadge(friends){
  const badge=document.getElementById('fr-badge');
  if(!badge) return;
  // Count incoming pending if available
  if(friends){
    const n=friends.filter(f=>f.status==='pending'&&f.direction==='received').length;
    badge.textContent=n; badge.classList.toggle('hidden',n===0);
  } else {
    api('/api/friends').then(r=>r.json()).then(f=>{
      if(!Array.isArray(f)) return;
      const n=f.filter(x=>x.status==='pending'&&x.direction==='received').length;
      badge.textContent=n; badge.classList.toggle('hidden',n===0);
    }).catch(()=>{});
  }
}
