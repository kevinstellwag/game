<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PartyGames 🎮</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Nunito',sans-serif;overflow-x:hidden}
:root{
  --bg:#0d0d1a;--bg2:#16162a;--card:#1e1e35;--card2:#262642;
  --accent:#ff6b6b;--accent2:#ffd93d;--accent3:#6bcb77;--accent4:#4d96ff;
  --text:#f0f0ff;--text2:#8888aa;--border:rgba(255,255,255,0.08);
  --shadow:0 4px 24px rgba(0,0,0,0.5);--r:14px;
}
body{background:var(--bg);color:var(--text)}
.screen{display:none;min-height:100vh}
.screen.active{display:flex;flex-direction:column}
input,textarea,button{font-family:'Nunito',sans-serif}
.hidden{display:none!important}

/* ===== HOME ===== */
#screen-home{position:relative;align-items:center;justify-content:center}
.home-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 50%,#2d1b69 0%,transparent 55%),radial-gradient(ellipse at 80% 20%,#1a3a5c 0%,transparent 55%),radial-gradient(ellipse at 60% 80%,#3d1515 0%,transparent 45%),var(--bg)}
.home-bg::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 2px 2px,rgba(255,255,255,0.03) 1px,transparent 0);background-size:40px 40px}
.home-wrap{position:relative;z-index:1;width:100%;max-width:460px;padding:2rem 1.25rem;text-align:center}
.logo-icon{font-size:5rem;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.logo-title{font-family:'Bangers',cursive;font-size:4rem;letter-spacing:4px;color:var(--text);text-shadow:0 0 40px rgba(255,107,107,0.5);line-height:1}
.logo-title span{color:var(--accent2)}
.logo-sub{color:var(--text2);font-style:italic;margin:0.4rem 0 2rem}
.home-btns{display:flex;gap:1rem;margin-bottom:1.25rem}
.btn-home{flex:1;display:flex;flex-direction:column;align-items:center;gap:0.4rem;padding:1.25rem 1rem;border-radius:var(--r);border:none;cursor:pointer;font-weight:900;font-size:1rem;color:white;transition:all 0.2s}
.btn-home span:first-child{font-size:1.6rem}
.btn-create{background:linear-gradient(135deg,#ff6b6b,#ee0979);box-shadow:0 6px 24px rgba(255,107,107,0.4)}
.btn-create:hover{transform:translateY(-3px);box-shadow:0 10px 32px rgba(255,107,107,0.6)}
.btn-join{background:linear-gradient(135deg,#4d96ff,#2356d4);box-shadow:0 6px 24px rgba(77,150,255,0.4)}
.btn-join:hover{transform:translateY(-3px);box-shadow:0 10px 32px rgba(77,150,255,0.6)}

/* ===== FORMS ===== */
.form-box{background:var(--card);border-radius:var(--r);padding:1.25rem;text-align:left;border:1px solid var(--border);box-shadow:var(--shadow);animation:slideUp 0.25s ease}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.form-box h2{font-family:'Bangers',cursive;font-size:1.7rem;letter-spacing:2px;color:var(--accent2);margin-bottom:0.75rem}
.form-box input,.form-box textarea{width:100%;padding:0.7rem 0.9rem;background:var(--bg);border:2px solid var(--border);border-radius:10px;color:var(--text);font-size:0.95rem;margin-bottom:0.6rem;transition:border-color 0.2s}
.form-box input:focus,.form-box textarea:focus{outline:none;border-color:var(--accent4)}
.form-box label{display:block;color:var(--text2);font-size:0.75rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:0.25rem;margin-top:0.25rem}
.game-picker{display:flex;flex-direction:column;gap:0.4rem;margin-bottom:0.75rem}
.gpick{padding:0.65rem 0.9rem;background:var(--bg2);border-radius:9px;cursor:pointer;border:2px solid var(--border);font-weight:700;transition:all 0.15s}
.gpick:hover{border-color:var(--accent4)}
.gpick.active{border-color:var(--accent2);background:rgba(255,217,61,0.1)}
.btn-act{width:100%;padding:0.85rem;background:linear-gradient(135deg,var(--accent),#ee0979);border:none;border-radius:10px;color:white;font-weight:900;font-size:1.05rem;cursor:pointer;transition:all 0.2s;margin-bottom:0.5rem}
.btn-act:hover{transform:translateY(-2px);filter:brightness(1.1)}
.btn-act:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn-sm{padding:0.5rem 0.9rem;background:var(--card2);border:2px solid var(--border);border-radius:8px;color:var(--text);font-weight:700;cursor:pointer;transition:all 0.15s;margin-bottom:0.5rem}
.btn-sm:hover{border-color:var(--accent4)}
.btn-back{width:100%;padding:0.6rem;background:transparent;border:2px solid var(--border);border-radius:10px;color:var(--text2);font-weight:700;cursor:pointer;transition:all 0.2s}
.btn-back:hover{border-color:var(--text2);color:var(--text)}
.btn-copy{padding:0.3rem 0.6rem;background:var(--card2);border:1px solid var(--border);border-radius:7px;color:var(--text);cursor:pointer;font-size:0.8rem;transition:all 0.15s}
.btn-copy:hover{background:var(--accent4)}

/* ===== LOBBY ===== */
#screen-lobby{min-height:100vh}
.lobby-header{background:var(--card);border-bottom:1px solid var(--border);padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.5rem}
.lobby-code{font-size:0.9rem;color:var(--text2);display:flex;align-items:center;gap:0.5rem}
.lobby-code strong{font-family:'Bangers',cursive;font-size:1.5rem;letter-spacing:3px;color:var(--accent2)}
.lobby-game-name{font-family:'Bangers',cursive;font-size:1.3rem;letter-spacing:2px;color:var(--text)}
.lobby-body{display:flex;flex-direction:column;gap:1rem;padding:1rem;max-width:600px;margin:0 auto;width:100%}
.lobby-players-box h3,.lobby-host-controls h3{font-family:'Bangers',cursive;font-size:1.3rem;letter-spacing:2px;color:var(--accent2);margin-bottom:0.6rem}
.lobby-player-row{display:flex;align-items:center;gap:0.75rem;padding:0.6rem 0.9rem;background:var(--card);border-radius:10px;border:1px solid var(--border);margin-bottom:0.4rem}
.lp-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:0.95rem;flex-shrink:0}
.lp-name{font-weight:800;flex:1}
.lp-badge{font-size:0.75rem;color:var(--text2)}
.lobby-host-controls{display:flex;flex-direction:column}
.lobby-host-controls input[type=number]{padding:0.6rem 0.8rem;background:var(--bg);border:2px solid var(--border);border-radius:9px;color:var(--text);font-size:0.95rem;margin-bottom:0.5rem;width:100%}
.lobby-host-controls input[type=number]:focus{outline:none;border-color:var(--accent4)}
.lobby-host-controls textarea{width:100%;padding:0.6rem 0.8rem;background:var(--bg);border:2px solid var(--border);border-radius:9px;color:var(--text);font-size:0.9rem;resize:vertical;margin-bottom:0.4rem}
.lobby-host-controls textarea:focus{outline:none;border-color:var(--accent4)}
.lobby-host-controls label{color:var(--text2);font-size:0.75rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin:0.5rem 0 0.25rem}
.wait-msg{text-align:center;color:var(--text2);padding:1.5rem;font-style:italic;background:var(--card);border-radius:var(--r);border:1px solid var(--border)}

/* ===== GAME SCREEN ===== */
#screen-game{flex-direction:column;min-height:100vh}
.game-header{background:var(--card);border-bottom:1px solid var(--border);padding:0.6rem 1rem;display:flex;align-items:center;gap:0.75rem;position:sticky;top:0;z-index:100}
.btn-back-sm{padding:0.35rem 0.8rem;background:transparent;border:2px solid var(--border);border-radius:8px;color:var(--text2);cursor:pointer;font-weight:700;font-size:0.85rem;transition:all 0.15s;white-space:nowrap}
.btn-back-sm:hover{border-color:var(--text2);color:var(--text)}
.game-code-pill{font-family:'Bangers',cursive;font-size:1.3rem;letter-spacing:3px;color:var(--accent2);flex:1;text-align:center}
.chat-toggle-btn{padding:0.35rem 0.8rem;background:var(--accent4);border:none;border-radius:8px;color:white;cursor:pointer;font-weight:800;font-size:0.85rem;position:relative;transition:all 0.15s}
.chat-toggle-btn:hover{filter:brightness(1.15)}
.chat-badge-dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;background:var(--accent);border-radius:50%;display:none}
.chat-badge-dot.show{display:block}
.game-layout{display:flex;flex:1;overflow:hidden;position:relative}
.game-area{flex:1;overflow-y:auto;padding:1rem}
.chat-panel{width:280px;display:flex;flex-direction:column;background:var(--card);border-left:1px solid var(--border)}
.chat-panel.hidden{display:none}
@media(max-width:600px){
  .chat-panel{position:fixed;right:0;top:0;bottom:0;z-index:200;width:85%;max-width:320px}
}
.chat-header{display:flex;align-items:center;justify-content:space-between;padding:0.75rem 1rem;border-bottom:1px solid var(--border);font-weight:800}
.chat-close{background:none;border:none;color:var(--text2);cursor:pointer;font-size:1rem;padding:0.2rem 0.4rem}
.chat-close:hover{color:var(--text)}
.chat-messages{flex:1;overflow-y:auto;padding:0.75rem;display:flex;flex-direction:column;gap:0.4rem}
.chat-messages::-webkit-scrollbar{width:3px}
.chat-messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.chat-msg{padding:0.45rem 0.7rem;border-radius:9px;background:var(--card2);border:1px solid var(--border);max-width:100%;word-break:break-word;animation:msgIn 0.2s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.chat-msg.mine{background:rgba(77,150,255,0.15);border-color:rgba(77,150,255,0.3)}
.chat-msg.sys{background:transparent;border:none;text-align:center;color:var(--text2);font-style:italic;font-size:0.8rem}
.chat-name{font-size:0.7rem;font-weight:900;color:var(--accent4);margin-bottom:0.1rem}
.chat-msg.mine .chat-name{color:var(--accent2)}
.chat-text{font-size:0.88rem}
.chat-input-row{display:flex;gap:0.4rem;padding:0.6rem}
.chat-input-row input{flex:1;padding:0.55rem 0.75rem;background:var(--bg);border:2px solid var(--border);border-radius:9px;color:var(--text);font-size:0.9rem}
.chat-input-row input:focus{outline:none;border-color:var(--accent4)}
.chat-input-row button{padding:0.55rem 0.85rem;background:var(--accent4);border:none;border-radius:9px;color:white;font-weight:800;cursor:pointer;transition:all 0.15s}
.chat-input-row button:hover{filter:brightness(1.15)}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card2);border:1px solid var(--border);padding:0.65rem 1.4rem;border-radius:50px;color:var(--text);font-weight:700;font-size:0.9rem;box-shadow:var(--shadow);z-index:9999;transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ===== GAME SHARED ===== */
.game-banner{border-radius:var(--r);padding:1.25rem;text-align:center;border:1px solid rgba(255,255,255,0.1);margin-bottom:1rem}
.game-banner-title{font-family:'Bangers',cursive;font-size:2rem;letter-spacing:3px}
.game-banner-sub{color:var(--text2);font-style:italic;margin-top:0.3rem}
.info-box{background:var(--card);border-radius:var(--r);padding:1rem;border:1px solid var(--border);margin-bottom:0.75rem}
.info-box h3{font-family:'Bangers',cursive;font-size:1.2rem;letter-spacing:2px;color:var(--accent2);margin-bottom:0.4rem}
.info-box p{color:var(--text2);font-size:0.9rem;line-height:1.5}
.btn-start-game{width:100%;padding:1rem;background:linear-gradient(135deg,#ff6b6b,#ee0979);border:none;border-radius:var(--r);color:white;font-family:'Bangers',cursive;font-size:1.4rem;letter-spacing:2px;cursor:pointer;transition:all 0.2s;margin-top:0.5rem}
.btn-start-game:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(255,107,107,0.4)}
.warn{color:var(--accent2);text-align:center;font-size:0.85rem;margin-top:0.4rem}
.waiting-txt{text-align:center;color:var(--text2);padding:1.5rem;font-style:italic;background:var(--card);border-radius:var(--r);border:1px solid var(--border)}
.scores-row{display:flex;align-items:center;gap:0.75rem;padding:0.55rem 0.75rem;background:var(--card);border-radius:9px;border:1px solid var(--border);margin-bottom:0.35rem}
.scores-row.winner{border-color:var(--accent2);background:rgba(255,217,61,0.07)}
.sc-name{width:90px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.sc-bar-wrap{flex:1;height:9px;background:var(--bg);border-radius:5px;overflow:hidden}
.sc-bar{height:100%;background:linear-gradient(90deg,var(--accent4),var(--accent));border-radius:5px;transition:width 0.5s ease}
.sc-pts{width:55px;text-align:right;font-family:'Bangers',cursive;font-size:1.1rem;color:var(--accent2);flex-shrink:0}

/* ===== CAH ===== */
.cah-topbar{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;background:var(--card);border-radius:9px;padding:0.55rem 0.9rem;border:1px solid var(--border);font-size:0.82rem;margin-bottom:0.75rem}
.cah-round{font-family:'Bangers',cursive;font-size:1.2rem;color:var(--accent2)}
.cah-czar{color:var(--text2)}
.sc-chips{display:flex;gap:0.3rem;flex-wrap:wrap;margin-left:auto}
.sc-chip{background:var(--card2);border-radius:20px;padding:0.15rem 0.5rem;font-size:0.72rem;font-weight:700}
.black-card{background:#000;color:white;border-radius:var(--r);padding:1.4rem;min-height:110px;position:relative;font-weight:700;border:2px solid rgba(255,255,255,0.1);box-shadow:0 6px 24px rgba(0,0,0,0.6);margin-bottom:0.75rem;display:flex;flex-direction:column;justify-content:center}
.black-card-corner{position:absolute;top:10px;left:12px;font-size:0.65rem;opacity:0.4;font-family:'Bangers',cursive;letter-spacing:1px}
.black-card-text{font-size:1.1rem;line-height:1.5;padding-top:0.5rem}
.black-card-pick{position:absolute;bottom:10px;right:12px;font-size:0.65rem;opacity:0.4}
.hand-label{font-weight:800;color:var(--text2);text-transform:uppercase;letter-spacing:1px;font-size:0.75rem;margin-bottom:0.6rem}
.white-cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:0.6rem}
.wcard{background:white;color:#111;border-radius:10px;padding:0.9rem;min-height:90px;cursor:pointer;position:relative;font-weight:700;transition:all 0.18s;border:3px solid transparent;box-shadow:0 3px 10px rgba(0,0,0,0.3)}
.wcard:hover{transform:translateY(-4px) rotate(-1deg);box-shadow:0 8px 20px rgba(0,0,0,0.4);border-color:#333}
.wcard.selected{border-color:#4d96ff;transform:translateY(-6px) scale(1.04)}
.wcard-text{font-size:0.88rem;line-height:1.35}
.wcard-brand{position:absolute;bottom:7px;right:8px;font-size:0.75rem;opacity:0.25}
.czar-box,.submitted-box,.judge-box{text-align:center;padding:1.5rem 1rem;background:var(--card);border-radius:var(--r);border:1px solid var(--border)}
.czar-box h3,.submitted-box h3,.judge-box h3{font-family:'Bangers',cursive;font-size:1.6rem;letter-spacing:2px;color:var(--accent2);margin:0.4rem 0 0.3rem}
.czar-box p,.submitted-box p{color:var(--text2);font-size:0.9rem}
.sub-counter{margin-top:0.75rem;font-weight:800;color:var(--accent4)}
.judge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:0.6rem;margin-top:0.75rem}
.judge-card:hover{transform:translateY(-6px) rotate(1deg);box-shadow:0 10px 28px rgba(0,0,0,0.5)}
.round-winner{text-align:center;padding:1.25rem;background:linear-gradient(135deg,rgba(255,215,0,0.12),rgba(255,107,107,0.12));border-radius:var(--r);border:2px solid rgba(255,215,0,0.25);margin-bottom:0.75rem}
.cah-combo-card{background:#000;color:white;border-radius:12px;padding:1.1rem 1.25rem;margin:0.75rem 0 0.25rem;font-size:1.05rem;font-weight:700;line-height:1.6;text-align:left;border:2px solid rgba(255,255,255,0.15);box-shadow:0 4px 20px rgba(0,0,0,0.5)}
.round-winner h3{font-family:'Bangers',cursive;font-size:1.8rem;letter-spacing:3px;color:var(--accent2)}
.round-winner p{color:var(--text2);margin-top:0.3rem;font-style:italic}
.game-winner{text-align:center;padding:2rem;background:linear-gradient(135deg,rgba(255,215,0,0.2),rgba(255,107,107,0.2));border-radius:var(--r);border:2px solid rgba(255,215,0,0.4);margin-bottom:0.75rem}
.game-winner h2{font-family:'Bangers',cursive;font-size:2.2rem;letter-spacing:3px;color:var(--accent2)}
.cah-next-btn{width:100%;padding:0.9rem;background:linear-gradient(135deg,#4d96ff,#2356d4);border:none;border-radius:var(--r);color:white;font-family:'Bangers',cursive;font-size:1.3rem;letter-spacing:2px;cursor:pointer;transition:all 0.2s;margin-top:0.75rem}
.cah-next-btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(77,150,255,0.4)}

/* ===== POKER ===== */
.poker-info{display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;background:#0a200a;border:1px solid #1a4a1a;border-radius:9px;padding:0.55rem 0.9rem;font-size:0.82rem;margin-bottom:0.75rem}
.your-turn-pill{background:var(--accent2);color:#111;font-weight:900;padding:0.15rem 0.65rem;border-radius:20px;font-size:0.78rem;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.community-box{background:#0a2a0a;border-radius:var(--r);padding:0.9rem;border:2px solid #1a4a1a;margin-bottom:0.75rem}
.community-label{font-size:0.7rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#4a8a4a;margin-bottom:0.6rem}
.cards-row{display:flex;gap:0.4rem;flex-wrap:wrap}
.pcard{width:48px;height:66px;background:white;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #ddd;box-shadow:0 3px 10px rgba(0,0,0,0.4);font-weight:900;gap:1px}
.pcard.red{color:#cc0000}.pcard.black{color:#111}
.pcard-back{background:linear-gradient(135deg,#1a1a8a,#111);color:#3a3aaa;font-size:1.4rem;border:2px solid #2a2aaa}
.pcard-r{font-size:0.85rem;line-height:1}.pcard-s{font-size:1rem;line-height:1}
.poker-seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:0.6rem;margin-bottom:0.75rem}
.seat{background:var(--card);border:2px solid var(--border);border-radius:var(--r);padding:0.7rem;text-align:center;transition:all 0.2s}
.seat.active-turn{border-color:var(--accent2);background:rgba(255,217,61,0.07)}
.seat.folded{opacity:0.35}
.seat-name{font-weight:800;font-size:0.88rem;margin-bottom:0.2rem}
.seat-chips{color:var(--accent3);font-size:0.82rem;font-weight:700}
.seat-bet{color:var(--accent2);font-size:0.72rem;min-height:0.9rem}
.seat-fold-tag{color:var(--accent);font-weight:900;font-size:0.72rem}
.my-hole{display:flex;gap:0.25rem;justify-content:center;margin-top:0.4rem}
.hidden-cards{font-size:1.1rem;letter-spacing:4px;margin-top:0.35rem}
.poker-actions{display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.5rem}
.paction{flex:1;min-width:75px;padding:0.7rem 0.4rem;border:none;border-radius:9px;color:white;font-weight:800;font-size:0.88rem;cursor:pointer;transition:all 0.15s}
.paction:hover{filter:brightness(1.15);transform:translateY(-1px)}
.pa-fold{background:linear-gradient(135deg,#880000,#cc0000)}
.pa-check{background:linear-gradient(135deg,#006688,#0099cc)}
.pa-call{background:linear-gradient(135deg,#006600,#00aa00)}
.pa-raise{background:linear-gradient(135deg,#884400,#cc6600)}
.raise-row{display:flex;align-items:center;gap:0.6rem;padding:0.5rem 0.75rem;background:var(--card);border-radius:9px;border:1px solid var(--border)}
.raise-row input[type=range]{flex:1;accent-color:var(--accent2)}
.poker-showdown{text-align:center;padding:1.5rem;background:var(--card);border-radius:var(--r);border:2px solid var(--accent2);margin-bottom:0.75rem}
.poker-showdown h3{font-family:'Bangers',cursive;font-size:2rem;letter-spacing:2px;color:var(--accent2)}
.chips-list{display:flex;flex-direction:column;gap:0.35rem;margin-bottom:0.75rem}
.chip-row{display:flex;justify-content:space-between;padding:0.5rem 0.9rem;background:var(--card);border-radius:8px;border:1px solid var(--border)}


/* ===== MONOPOLY NEW ===== */
/* topbar */
.mono-topbar{display:flex;align-items:center;justify-content:space-between;background:#0a140a;border:1px solid #1f3f1f;border-radius:10px;padding:.45rem .7rem;margin-bottom:.5rem;gap:.4rem;flex-wrap:wrap}
.mono-tb-left{display:flex;align-items:center;gap:.35rem;min-width:80px}
.mono-tb-mid{flex:1;text-align:center}
.mono-tb-right{display:flex;align-items:center;gap:.35rem;justify-content:flex-end;min-width:80px}
.mono-die{font-size:1.6rem;line-height:1;display:inline-block}
.die-rolling{animation:dieRollCont .25s ease infinite;filter:blur(.5px);opacity:.7}
@keyframes dieRollCont{0%{transform:rotate(-15deg)scale(.85)}50%{transform:rotate(15deg)scale(1.1)}100%{transform:rotate(-15deg)scale(.85)}}
.die-spin{animation:dieSpin .07s ease;filter:blur(1px)}
@keyframes dieSpin{0%{transform:rotate(-20deg)scale(.75)}50%{transform:rotate(10deg)scale(1.15)}100%{transform:rotate(0)scale(1)}}
.die-land{animation:dieLand .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes dieLand{0%{transform:scale(.5)rotate(-20deg)}60%{transform:scale(1.4)rotate(5deg)}100%{transform:scale(1)rotate(0)}}
.mono-dsum{font-family:Bangers,cursive;font-size:1.1rem;color:#ffd93d;margin-left:2px}
.mono-noroll{color:#445;font-size:.82rem}
.turn-pill{background:linear-gradient(135deg,#7700ff,#4400aa);color:#fff;border-radius:20px;padding:.2rem .75rem;font-weight:900;font-size:.82rem;animation:pulse 1.2s infinite}
.cop-pill{color:#ffd93d;font-weight:800;font-size:.82rem;animation:pulse 1s infinite}
.wait-pill{color:#667;font-size:.82rem}
.my-money{color:#6bcb77;font-family:Bangers,cursive;font-size:1.1rem;letter-spacing:1px}
.badge-fp,.badge-jail{font-size:.95rem}
/* layout */
.mono-layout{display:flex;gap:.5rem;margin-bottom:.5rem;align-items:flex-start}
.mono-board-wrap{flex:0 0 auto;width:min(calc(100vw - 106px),600px);position:relative}
/* board grid */
.mono-board{display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);gap:1px;background:#111;border-radius:8px;padding:2px;border:2px solid #2a4a2a;aspect-ratio:1/1;width:100%}
/* center log overlay */
.mono-center-log{position:absolute;top:calc(100%/11 + 4px);left:calc(100%/11 + 4px);right:calc(100%/11 + 4px);bottom:calc(100%/11 + 4px);pointer-events:none;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:4px;overflow:hidden}
.mcl-title{font-family:Bangers,cursive;font-size:clamp(.8rem,2.2vw,1.35rem);letter-spacing:3px;color:#6bcb77;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.9);line-height:1.2;margin-bottom:5px}
.mcl-feed{display:flex;flex-direction:column;gap:2px;width:100%}
.mcl-entry{font-size:clamp(.42rem,1.05vw,.68rem);color:rgba(255,255,255,.92);text-align:center;line-height:1.35;padding:2px 3px;background:rgba(0,0,0,.62);border-radius:4px;backdrop-filter:blur(2px)}
.mcl-money{color:#6bcb77;font-weight:800}
/* cells */
.mcell{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;border-radius:2px;cursor:default;transition:filter .12s;min-width:0;min-height:0}
.mcell:hover{filter:brightness(1.4);z-index:5}
.mcell-inner{background:#060c06!important;pointer-events:none}
.mcell-corner{border-radius:3px;border:1px solid rgba(255,255,255,.1)!important}
.mcell-stripe{position:absolute;top:0;left:0;right:0;height:5px;z-index:2;box-shadow:0 1px 5px rgba(0,0,0,.4)}
.mcell-own-glow{position:absolute;inset:0;z-index:1;pointer-events:none;border-radius:2px}
.mcell-body{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:1px;gap:1px}
.mcell-emoji{font-size:clamp(.65rem,1.9vw,1.1rem);line-height:1}
.mcell-label{font-size:clamp(.2rem,.75vw,.38rem);color:rgba(255,255,255,.5);text-align:center;line-height:1.1;overflow:hidden;max-height:2.2em;word-break:break-word;padding:0 1px}
.mcell-lvl{position:absolute;top:1px;right:1px;font-size:clamp(.22rem,.65vw,.42rem);z-index:4}
.mcell-land{animation:cellLand .5s ease}
@keyframes cellLand{0%{filter:brightness(4)}100%{filter:brightness(1)}}
/* tokens */
.mcell-tokens{position:absolute;bottom:1px;left:0;right:0;display:flex;flex-wrap:wrap;justify-content:center;gap:1px;z-index:10;padding:0 1px}
.mtoken{border-radius:50%;width:clamp(12px,2.6vw,19px);height:clamp(12px,2.6vw,19px);display:flex;align-items:center;justify-content:center;font-size:clamp(.42rem,1.2vw,.72rem);font-weight:900;border:2px solid rgba(255,255,255,.55);cursor:default;transition:transform .15s;flex-shrink:0;line-height:1;box-shadow:0 2px 5px rgba(0,0,0,.6)}
.mtoken:hover{transform:scale(1.5);z-index:20}
.mtoken-me{border-color:#fff!important;box-shadow:0 0 0 2px rgba(255,255,255,.4),0 2px 8px rgba(0,0,0,.7)!important;animation:mePulse 2s infinite}
@keyframes mePulse{0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.4)}50%{box-shadow:0 0 0 3px rgba(255,255,255,.7),0 0 10px rgba(255,255,255,.3)}}
.tok-flash{animation:tokFlash .2s ease}
@keyframes tokFlash{0%{transform:scale(1.7)}100%{transform:scale(1)}}
/* sidebar */
.mono-sidebar{flex:0 0 95px;min-width:85px;max-width:95px;display:flex;flex-direction:column;gap:.4rem}
.ms-title{font-family:Bangers,cursive;font-size:1rem;letter-spacing:2px;color:#6bcb77;text-align:center}
.ms-players{display:flex;flex-direction:column;gap:.3rem}
.ms-player{display:flex;align-items:center;gap:.35rem;padding:.25rem .35rem;background:#111;border-radius:7px}
.ms-me{background:#0d1a0d!important;border:1px solid #2a4a2a}
.ms-bankrupt{opacity:.3}
.ms-tok{border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.62rem;flex-shrink:0}
.ms-cop{background:#ffd93d;color:#111;font-size:.72rem}
.ms-info{flex:1;min-width:0}
.ms-name{font-size:.62rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-cash{font-size:.58rem;color:#6bcb77;font-family:Bangers,cursive;letter-spacing:.5px}
.ms-colors{display:flex;flex-direction:column;gap:2px;margin-top:.25rem}
.ms-col-row{display:flex;align-items:center;gap:.25rem}
.ms-col-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.ms-col-name{font-size:.55rem;color:#777}
/* properties */
.mono-props{margin-bottom:.5rem}
.mono-props-hdr{font-family:Bangers,cursive;font-size:.95rem;letter-spacing:2px;color:#ffd93d;margin-bottom:.35rem}
.mono-props-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(85px,1fr));gap:.35rem}
.mpcard{background:#111;border-radius:8px;padding:.45rem .35rem;text-align:center}
.mpcard-top{font-size:.7rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:.25rem;margin-bottom:.15rem}
.mpcard-top span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.6rem}
.mpcard-level{font-size:.55rem;color:#aaa;margin-bottom:.25rem}
.mpcard-upg{width:100%;padding:.25rem;background:linear-gradient(135deg,#228b22,#0a5a0a);border:none;border-radius:6px;color:#fff;font-size:.6rem;font-weight:900;cursor:pointer;font-family:Nunito,sans-serif}
.mpcard-upg:hover{filter:brightness(1.2)}
.mpcard-rent{font-size:.58rem;color:#6bcb77;font-weight:700}
/* actions */
.mono-actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem}
.mact{flex:1;min-width:120px;padding:.65rem .5rem;border:none;border-radius:10px;color:#fff;font-weight:900;font-size:.88rem;cursor:pointer;transition:all .2s;font-family:Nunito,sans-serif}
.mact:hover{transform:translateY(-2px);filter:brightness(1.15)}
.mact:active{transform:translateY(0)}
.mact-roll{background:linear-gradient(135deg,#4d1a99,#9933ff);box-shadow:0 4px 16px rgba(153,51,255,.35)}
.mact-end{background:linear-gradient(135deg,#333,#555)}
.mact-fp{background:linear-gradient(135deg,#cc9900,#ffd93d);color:#111}
/* overlay & popups */
.mono-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:500;display:flex;align-items:center;justify-content:center;padding:1rem;animation:fadeIn .15s ease}
.mono-overlay-inner{max-width:340px;width:100%}
.popup{background:#161628;border-radius:16px;padding:1.3rem;text-align:center;animation:popIn .25s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden;border:2px solid #2a2a4a}
.pop-stripe{position:absolute;top:0;left:0;right:0;height:5px}
.pop-emoji{font-size:2.8rem;margin:.3rem 0}
.pop-title{font-family:Bangers,cursive;font-size:1.6rem;letter-spacing:2px;color:#fff;margin-bottom:.35rem}
.pop-desc{color:#aaa;font-size:.82rem;font-style:italic;margin-bottom:.5rem;line-height:1.4}
.pop-stats{display:flex;justify-content:center;gap:1rem;margin-bottom:.5rem}
.pop-stat{font-size:.82rem;color:#ccc}.pop-stat strong{color:#fff}
.pop-upgrades{font-size:1rem;margin-bottom:.6rem;letter-spacing:3px}
.pop-cardtext{font-size:.95rem;font-weight:700;color:#ddd;margin:.4rem 0 .9rem;line-height:1.5;background:#0d0d1a;border-radius:8px;padding:.65rem}
.pop-big-price{font-family:Bangers,cursive;font-size:1.9rem;color:#ffd93d;margin:.3rem 0 .7rem;letter-spacing:2px}
.pop-big-icon{font-size:3.5rem;animation:bounce .5s ease;margin-bottom:.25rem}
.pop-btns{display:flex;flex-direction:column;gap:.45rem;margin-top:.5rem}
.pbtn{padding:.65rem 1rem;border:none;border-radius:10px;font-weight:900;font-size:.88rem;cursor:pointer;transition:all .15s;font-family:Nunito,sans-serif}
.pbtn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.pbtn-buy{background:linear-gradient(135deg,#228b22,#6bcb77);color:#fff}
.pbtn-skip{background:#1a1a2e;color:#888;border:2px solid #333}
.pbtn-dash{background:linear-gradient(135deg,#ff6b00,#ff9f43);color:#fff}
.pbtn-pay{background:#1a1a2e;color:#ddd;border:2px solid #333}
.pbtn-ok{background:linear-gradient(135deg,#4d96ff,#2356d4);color:#fff;width:100%;margin-top:.45rem}
.pbtn-spin{background:linear-gradient(135deg,#9933ff,#4d1a99);color:#fff;font-size:1.05rem;padding:.9rem;animation:pulse 1s infinite;width:100%;margin-top:.45rem}
.pop-note{color:#888;font-size:.7rem;margin-top:.35rem}
.pop-warn{color:#ff6b6b;font-weight:700;margin:.35rem 0}
.pop-wait{color:#555;font-style:italic;margin-top:.7rem;font-size:.82rem}
.spin-result-icon{font-size:3.5rem;animation:bounce .5s ease;margin-bottom:.25rem}
/* ===== POKER ===== */
.poker-info{display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;background:#0a200a;border:1px solid #1a4a1a;border-radius:9px;padding:0.55rem 0.9rem;font-size:0.82rem;margin-bottom:0.75rem}
.your-turn-pill{background:var(--accent2);color:#111;font-weight:900;padding:0.15rem 0.65rem;border-radius:20px;font-size:0.78rem;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.community-box{background:#0a2a0a;border-radius:var(--r);padding:0.9rem;border:2px solid #1a4a1a;margin-bottom:0.75rem}
.community-label{font-size:0.7rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#4a8a4a;margin-bottom:0.6rem}
.cards-row{display:flex;gap:0.4rem;flex-wrap:wrap}
.pcard{width:48px;height:66px;background:white;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #ddd;box-shadow:0 3px 10px rgba(0,0,0,0.4);font-weight:900;gap:1px}
.pcard.red{color:#cc0000}.pcard.black{color:#111}
.pcard-back{background:linear-gradient(135deg,#1a1a8a,#111);color:#3a3aaa;font-size:1.4rem;border:2px solid #2a2aaa}
.pcard-r{font-size:0.85rem;line-height:1}.pcard-s{font-size:1rem;line-height:1}
.poker-seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:0.6rem;margin-bottom:0.75rem}
.seat{background:var(--card);border:2px solid var(--border);border-radius:var(--r);padding:0.7rem;text-align:center;transition:all 0.2s}
.seat.active-turn{border-color:var(--accent2);background:rgba(255,217,61,0.07)}
.seat.folded{opacity:0.35}
.seat-name{font-weight:800;font-size:0.88rem;margin-bottom:0.2rem}
.seat-chips{color:var(--accent3);font-size:0.82rem;font-weight:700}
.seat-bet{color:var(--accent2);font-size:0.72rem;min-height:0.9rem}
.seat-fold-tag{color:var(--accent);font-weight:900;font-size:0.72rem}
.my-hole{display:flex;gap:0.25rem;justify-content:center;margin-top:0.4rem}
.hidden-cards{font-size:1.1rem;letter-spacing:4px;margin-top:0.35rem}
.poker-actions{display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.5rem}
.paction{flex:1;min-width:75px;padding:0.7rem 0.4rem;border:none;border-radius:9px;color:white;font-weight:800;font-size:0.88rem;cursor:pointer;transition:all 0.15s}
.paction:hover{filter:brightness(1.15);transform:translateY(-1px)}
.pa-fold{background:linear-gradient(135deg,#880000,#cc0000)}
.pa-check{background:linear-gradient(135deg,#006688,#0099cc)}
.pa-call{background:linear-gradient(135deg,#006600,#00aa00)}
.pa-raise{background:linear-gradient(135deg,#884400,#cc6600)}
.raise-row{display:flex;align-items:center;gap:0.6rem;padding:0.5rem 0.75rem;background:var(--card);border-radius:9px;border:1px solid var(--border)}
.raise-row input[type=range]{flex:1;accent-color:var(--accent2)}
.poker-showdown{text-align:center;padding:1.5rem;background:var(--card);border-radius:var(--r);border:2px solid var(--accent2);margin-bottom:0.75rem}
.poker-showdown h3{font-family:'Bangers',cursive;font-size:2rem;letter-spacing:2px;color:var(--accent2)}
.chips-list{display:flex;flex-direction:column;gap:0.35rem;margin-bottom:0.75rem}
.chip-row{display:flex;justify-content:space-between;padding:0.5rem 0.9rem;background:var(--card);border-radius:8px;border:1px solid var(--border)}


/* ===== MONOPOLY NEW ===== */
.mono-topbar{display:flex;align-items:center;justify-content:space-between;background:#0a120a;border:1px solid #1a3a1a;border-radius:10px;padding:0.5rem 0.8rem;margin-bottom:0.6rem;gap:0.4rem;flex-wrap:wrap}
.mono-tb-left{display:flex;align-items:center;gap:0.3rem;min-width:90px}
.mono-tb-mid{flex:1;text-align:center}
.mono-tb-right{display:flex;align-items:center;gap:0.4rem;justify-content:flex-end}
.mono-die{font-size:1.5rem;line-height:1;filter:drop-shadow(0 0 4px rgba(255,215,0,0.4))}
.mono-dsum{font-family:Bangers,cursive;font-size:1.1rem;color:#ffd93d;margin-left:0.2rem}
.mono-no-roll{color:#445;font-size:0.8rem}
.my-money{color:#6bcb77;font-weight:900;font-size:1rem}
.cop-riding{color:#ffd93d;font-weight:800;animation:pulse 1s infinite}
.waiting-turn{color:#778;font-size:0.9rem}
.jail-badge{background:#ff4444;color:white;border-radius:10px;padding:0.1rem 0.4rem;font-size:0.75rem}

/* BOARD LAYOUT */
.mono-board-wrap{display:flex;gap:0.5rem;margin-bottom:0.6rem;align-items:flex-start}
.mono-board{display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);gap:1px;background:#000;border-radius:8px;padding:2px;border:2px solid #1a3a1a;flex:1;aspect-ratio:1;min-width:0}
.mono-sidebar{width:130px;flex-shrink:0;display:flex;flex-direction:column;gap:0.4rem}

/* CELLS */
.mcell{border-radius:2px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border:1px solid rgba(255,255,255,0.05);transition:filter 0.1s,transform 0.1s;min-width:0;min-height:0;cursor:default}
.mcell:hover:not(.mcell-inner){filter:brightness(1.4);z-index:5;transform:scale(1.08)}
.mcell-inner{background:#0a0f0a!important;border:none!important;pointer-events:none}
.mcell-corner{border:1px solid rgba(255,255,255,0.15)!important}
.mcell-flash{filter:brightness(2.5)!important;z-index:10!important;transform:scale(1.15)!important}

/* Cell content layers */
.mcell-colorband{position:absolute;top:0;left:0;right:0;height:28%;min-height:3px;z-index:1;opacity:0.9}
.mcell-owned{position:absolute;inset:0;z-index:0;pointer-events:none}
.mcell-inner-content{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:1px;z-index:2;width:100%;height:100%}
.mcell-emoji{font-size:clamp(0.45rem,1.6vw,0.85rem);line-height:1;margin-bottom:1px}
.mcell-name{font-size:clamp(0.2rem,0.65vw,0.38rem);color:rgba(255,255,255,0.55);text-align:center;line-height:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;max-width:100%}
.mcell-lvl{position:absolute;top:28%;right:1px;font-size:clamp(0.25rem,0.6vw,0.4rem);z-index:3;line-height:1}

/* Tokens — bigger & more visible */
.mcell-tokens{position:absolute;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:1px;z-index:10;padding:1px;pointer-events:none}
.mtoken-sm{border-radius:50%;width:clamp(9px,2.2vw,16px);height:clamp(9px,2.2vw,16px);display:inline-flex;align-items:center;justify-content:center;font-size:clamp(0.3rem,0.9vw,0.55rem);font-weight:900;border:1.5px solid rgba(255,255,255,0.6);box-shadow:0 1px 4px rgba(0,0,0,0.8);flex-shrink:0;transition:transform 0.1s}
@keyframes tokenBounce{0%{transform:scale(0) translateY(-4px)}60%{transform:scale(1.3) translateY(-2px)}100%{transform:scale(1) translateY(0)}}

/* SIDEBAR */
.mono-side-title{font-family:Bangers,cursive;font-size:1rem;letter-spacing:2px;color:#6bcb77;text-align:center;padding:0.3rem 0;border-bottom:1px solid #1a3a1a}
.mono-legend{display:flex;flex-direction:column;gap:3px;padding:0.3rem 0}
.mono-leg-row{display:flex;align-items:center;gap:0.35rem;padding:2px 3px;border-radius:5px;transition:background 0.2s}
.mono-leg-row.leg-me{background:#ffffff08}
.mono-leg-row.leg-bankrupt{opacity:0.3}
.mono-leg-tok{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:0.6rem;font-weight:900;color:white;flex-shrink:0;border:1px solid rgba(255,255,255,0.3)}
.mono-leg-info{min-width:0}
.mono-leg-name{font-size:0.62rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:white}
.mono-leg-money{font-size:0.58rem;color:#6bcb77;font-weight:700}
.mono-color-legend{display:flex;flex-direction:column;gap:2px;padding:0.3rem 0;border-top:1px solid #1a2a1a;margin-top:2px}
.mcl-row{display:flex;align-items:flex-start;gap:0.3rem}
.mcl-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;margin-top:2px}
.mcl-names{font-size:0.52rem;color:#667;line-height:1.3;overflow:hidden}

/* MY PROPERTIES */
.mono-props{margin-bottom:0.6rem}
.mono-props-title{font-family:Bangers,cursive;font-size:1rem;color:#ffd93d;margin-bottom:0.3rem;letter-spacing:1px}
.mono-props-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:0.35rem}
.mono-prop-card{background:#131320;border:1px solid #252545;border-radius:8px;padding:0.45rem;text-align:center}
.mpc-emoji{font-size:1.1rem}
.mpc-name{font-size:0.65rem;font-weight:800;margin:0.1rem 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:white}
.mpc-level{font-size:0.6rem;color:#aaa;margin-bottom:0.25rem}
.mpc-upgrade{width:100%;padding:0.25rem;background:linear-gradient(135deg,#1a5a1a,#2d8b2d);border:none;border-radius:5px;color:white;font-size:0.65rem;font-weight:800;cursor:pointer}
.mpc-upgrade:hover{filter:brightness(1.2)}
.mpc-rent{font-size:0.62rem;color:#6bcb77;font-weight:700}

/* ACTIONS */
.mono-actions{display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.6rem}
.maction{flex:1;min-width:100px;padding:0.7rem 0.5rem;border:none;border-radius:9px;color:white;font-weight:900;font-size:0.9rem;cursor:pointer;transition:all 0.15s;font-family:Nunito,sans-serif}
.maction:hover{transform:translateY(-2px);filter:brightness(1.15)}
.maction:active{transform:translateY(0)}
.ma-roll{background:linear-gradient(135deg,#4d1a99,#9933ff);box-shadow:0 3px 12px rgba(153,51,255,0.3)}

@keyframes bounce{0%{transform:scale(0.5);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}

</style>
</head>
<body>

<!-- ===== HOME ===== -->
<div id="screen-home" class="screen active">
  <div class="home-bg"></div>
  <div class="home-wrap">
    <div class="logo-area">
      <div class="logo-icon">🎮</div>
      <h1 class="logo-title">PARTY<span>GAMES</span></h1>
      <p class="logo-sub">Voor slechte mensen met goede vrienden.</p>
    </div>
    <div class="home-btns">
      <button class="btn-home btn-create" onclick="UI.showForm('create')">
        <span>🚀</span><span>Kamer Aanmaken</span>
      </button>
      <button class="btn-home btn-join" onclick="UI.showForm('join')">
        <span>🔑</span><span>Kamer Joinen</span>
      </button>
    </div>
    <div id="form-create" class="form-box hidden">
      <h2>Nieuwe Kamer</h2>
      <input id="in-create-name" type="text" placeholder="Jouw naam" maxlength="20" autocomplete="off">
      <label>Kies een spel:</label>
      <div class="game-picker" id="game-picker-create">
        <div class="gpick active" data-game="cah">🃏 Cards Against Humanity</div>
        <div class="gpick" data-game="poker">♠️ Poker</div>
        <div class="gpick" data-game="monopoly">🏦 Monopoly</div>
      </div>
      <button class="btn-act" onclick="App.createRoom()">Aanmaken!</button>
      <button class="btn-back" onclick="UI.hideForm()">← Terug</button>
    </div>
    <div id="form-join" class="form-box hidden">
      <h2>Join een Kamer</h2>
      <input id="in-join-name" type="text" placeholder="Jouw naam" maxlength="20" autocomplete="off">
      <input id="in-join-code" type="text" placeholder="Kamer code (bijv. XK7P2Q)" maxlength="6" style="text-transform:uppercase" autocomplete="off">
      <button class="btn-act" onclick="App.joinRoom()">Joinen!</button>
      <button class="btn-back" onclick="UI.hideForm()">← Terug</button>
    </div>
  </div>
</div>

<!-- ===== LOBBY ===== -->
<div id="screen-lobby" class="screen">
  <div class="lobby-header">
    <div class="lobby-code">
      Code: <strong id="lob-code">------</strong>
      <button class="btn-copy" onclick="App.copyCode()">📋</button>
    </div>
    <div id="lob-game-name" class="lobby-game-name">🃏 Cards Against Humanity</div>
  </div>
  <div class="lobby-body">
    <div class="lobby-players-box">
      <h3>Spelers</h3>
      <div id="lob-players"></div>
    </div>
    <div id="lob-host-controls" class="lobby-host-controls hidden">
      <h3>Host Opties</h3>
      <label>Punten om te winnen (CAH):</label>
      <input type="number" id="lob-maxpts" value="7" min="1" max="50" onchange="App.updateSettings()">
      <label>Spel wisselen:</label>
      <div class="game-picker" id="game-picker-switch">
        <div class="gpick" data-game="cah">🃏 Cards Against Humanity</div>
        <div class="gpick" data-game="poker">♠️ Poker</div>
        <div class="gpick" data-game="monopoly">🏦 Monopoly</div>
      </div>
      <label>Eigen Zwarte Kaart (met ___):</label>
      <textarea id="cah-custom-black" placeholder="Mijn huisdier doet ___." rows="2"></textarea>
      <button class="btn-sm" onclick="App.addCard('black')">+ Zwarte Kaart</button>
      <label>Eigen Witte Kaart (antwoord):</label>
      <textarea id="cah-custom-white" placeholder="Een heel slechte keuze." rows="2"></textarea>
      <button class="btn-sm" onclick="App.addCard('white')">+ Witte Kaart</button>
      <button class="btn-act" id="btn-start-game" onclick="App.startGame()">🚀 Start Spel!</button>
    </div>
    <div id="lob-wait-msg" class="wait-msg">Wachten op de host om het spel te starten...</div>
  </div>
</div>

<!-- ===== IN GAME ===== -->
<div id="screen-game" class="screen">
  <div class="game-header">
    <button class="btn-back-sm" onclick="UI.backToLobby()">← Lobby</button>
    <div id="game-room-code" class="game-code-pill"></div>
    <button class="chat-toggle-btn" id="chat-toggle-btn" onclick="UI.toggleChat()">💬 Chat</button>
  </div>
  <div class="game-layout">
    <div id="game-area" class="game-area"></div>
    <div id="chat-panel" class="chat-panel hidden">
      <div class="chat-header">
        💬 Chat
        <button onclick="UI.toggleChat()" class="chat-close">✕</button>
      </div>
      <div id="chat-messages" class="chat-messages"></div>
      <div class="chat-input-row">
        <input id="chat-input" type="text" placeholder="Typ iets..." maxlength="200"
          onkeydown="if(event.key==='Enter'){event.preventDefault();App.sendChat();}">
        <button onclick="App.sendChat()">➤</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ===== STATE =====
let WS = null;
let myId = null;
let myRoomState = null;
let selectedGame = 'cah';
let chatOpen = false;
let unread = 0;
let wsReconnectTimer = null;

const COLORS = ['#FF6B6B','#4ECDC4','#FFE66D','#A8E6CF','#FF8B94','#B4F8C8','#FBE7C6','#A0C4FF'];

// ===== WEBSOCKET =====
function connectWS(onOpen) {
  if (WS && (WS.readyState === 0 || WS.readyState === 1)) {
    // Already connecting or connected
    if (WS.readyState === 1 && onOpen) onOpen();
    return;
  }

  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = `${proto}//${location.host}`;
  console.log('[WS] Connecting to', url);
  
  WS = new WebSocket(url);

  WS.onopen = () => {
    console.log('[WS] Connected!');
    // Start client-side keepalive ping every 15s
    if (wsReconnectTimer) clearInterval(wsReconnectTimer);
    wsReconnectTimer = setInterval(() => {
      if (WS && WS.readyState === 1) WS.send(JSON.stringify({ type: 'PING' }));
    }, 15000);
    if (onOpen) onOpen();
  };

  WS.onmessage = (e) => {
    try {
      handleMsg(JSON.parse(e.data));
    } catch(err) {
      console.error('[WS] Parse error:', err);
    }
  };

  WS.onclose = (e) => {
    console.log('[WS] Closed:', e.code, e.reason);
    if (wsReconnectTimer) clearInterval(wsReconnectTimer);
    // Only show error if we were actually in a room
    if (myRoomState) toast('❌ Verbinding verbroken! Ververs de pagina.');
  };

  WS.onerror = (e) => {
    console.error('[WS] Error:', e);
  };
}

function sendWS(data) {
  if (!WS || WS.readyState !== 1) {
    toast('❌ Niet verbonden!');
    return;
  }
  WS.send(JSON.stringify(data));
}

function handleMsg(msg) {
  if (msg.type === 'PONG') return; // keepalive response

  if (msg.type === 'ROOM_JOINED') {
    myId = msg.yourId;
    myRoomState = msg.roomState;
    UI.enterLobby();
    return;
  }
  if (msg.type === 'ROOM_UPDATE') {
    myRoomState = msg.roomState;
    // If server reset to lobby, go back to lobby screen for everyone
    if (msg.roomState.phase === 'lobby') {
      show('screen-lobby');
    }
    UI.refreshLobby();
    return;
  }
  if (msg.type === 'SYS') {
    addChatMsg({ system: true, text: msg.text });
    return;
  }
  if (msg.type === 'CHAT') {
    addChatMsg(msg.message);
    return;
  }
  if (msg.type === 'CHAT_HISTORY') {
    msg.messages.forEach(m => addChatMsg(m, false));
    return;
  }
  if (msg.type === 'GAME_STATE') {
    myRoomState = msg.roomState;
    UI.enterGame();
    if (msg.game === 'cah') CAH.render(msg.state);
    else if (msg.game === 'poker') Poker.render(msg.state);
    else if (msg.game === 'monopoly') Mono.render(msg.state);
    return;
  }
  if (msg.type === 'TOAST') {
    toast(msg.text);
    return;
  }
  if (msg.type === 'ERROR') {
    toast('❌ ' + msg.message);
    return;
  }
}

// ===== APP ACTIONS =====
const App = {
  createRoom() {
    const name = document.getElementById('in-create-name').value.trim();
    if (!name) { toast('Vul je naam in!'); return; }
    connectWS(() => sendWS({ type: 'CREATE_ROOM', playerName: name, game: selectedGame }));
  },

  joinRoom() {
    const name = document.getElementById('in-join-name').value.trim();
    const code = document.getElementById('in-join-code').value.trim().toUpperCase();
    if (!name) { toast('Vul je naam in!'); return; }
    if (!code) { toast('Vul de kamer code in!'); return; }
    connectWS(() => sendWS({ type: 'JOIN_ROOM', playerName: name, code }));
  },

  startGame() {
    sendWS({ type: 'GAME_ACTION', action: 'START_GAME' });
  },

  sendChat() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text) return;
    sendWS({ type: 'CHAT', text });
    input.value = '';
  },

  copyCode() {
    const code = myRoomState?.code || '';
    navigator.clipboard.writeText(code).then(() => toast('📋 Code gekopieerd: ' + code));
  },

  updateSettings() {
    const pts = parseInt(document.getElementById('lob-maxpts').value) || 7;
    sendWS({ type: 'UPDATE_SETTINGS', settings: { maxPoints: pts } });
  },

  addCard(type) {
    const el = document.getElementById(type === 'black' ? 'cah-custom-black' : 'cah-custom-white');
    const card = el.value.trim();
    if (!card) { toast('Type eerst een kaart!'); return; }
    if (type === 'black' && !card.includes('___')) { toast('Zwarte kaart moet ___ bevatten!'); return; }
    sendWS({ type: 'GAME_ACTION', action: 'ADD_CARD', cardType: type, card });
    el.value = '';
    toast('✅ Kaart toegevoegd!');
  },

  switchGame(game) {
    sendWS({ type: 'SET_GAME', game });
  },
};

// ===== UI =====
const UI = {
  showForm(type) {
    document.getElementById('form-create').classList.add('hidden');
    document.getElementById('form-join').classList.add('hidden');
    document.getElementById(`form-${type}`).classList.remove('hidden');
  },
  hideForm() {
    document.getElementById('form-create').classList.add('hidden');
    document.getElementById('form-join').classList.add('hidden');
  },

  enterLobby() {
    show('screen-lobby');
    UI.refreshLobby();
  },

  refreshLobby() {
    if (!myRoomState) return;
    const rs = myRoomState;
    const amHost = rs.players.find(p => p.id === myId)?.isHost;

    document.getElementById('lob-code').textContent = rs.code;
    const gameNames = { cah: '🃏 Cards Against Humanity', poker: '♠️ Poker', monopoly: '🏦 Monopoly' };
    document.getElementById('lob-game-name').textContent = gameNames[rs.game] || rs.game;

    // Players
    const pList = document.getElementById('lob-players');
    pList.innerHTML = rs.players.map((p, i) => `
      <div class="lobby-player-row">
        <div class="lp-avatar" style="background:${COLORS[i%COLORS.length]};color:#1a1a2e">${p.name.charAt(0).toUpperCase()}</div>
        <div class="lp-name">${esc(p.name)} ${p.id === myId ? '<span style="color:var(--accent4)">(jij)</span>' : ''}</div>
        <div class="lp-badge">${p.isHost ? '👑 Host' : '🎮'}</div>
      </div>
    `).join('');

    // Host controls
    document.getElementById('lob-host-controls').classList.toggle('hidden', !amHost);
    document.getElementById('lob-wait-msg').classList.toggle('hidden', !!amHost);

    if (amHost) {
      // Sync maxpoints
      const pts = document.getElementById('lob-maxpts');
      if (rs.settings?.maxPoints) pts.value = rs.settings.maxPoints;
    }

    // If game is in progress, go to game screen
    if (rs.phase === 'ingame') {
      UI.enterGame();
    }
  },

  enterGame() {
    show('screen-game');
    document.getElementById('game-room-code').textContent = myRoomState?.code || '';
  },

  backToLobby() {
    // Reset game on server back to lobby so new players can join cleanly
    if (isHost()) {
      sendWS({ type: 'SET_GAME', game: myRoomState?.game || 'cah' });
    }
    show('screen-lobby');
    // Small delay so server has time to reset before we refresh
    setTimeout(() => UI.refreshLobby(), 100);
  },

  toggleChat() {
    chatOpen = !chatOpen;
    document.getElementById('chat-panel').classList.toggle('hidden', !chatOpen);
    if (chatOpen) {
      unread = 0;
      document.querySelector('.chat-badge-dot')?.classList.remove('show');
      const msgs = document.getElementById('chat-messages');
      msgs.scrollTop = msgs.scrollHeight;
    }
  },
};

// ===== GAME PICKER =====
function initGamePickers() {
  document.querySelectorAll('.game-picker').forEach(picker => {
    picker.querySelectorAll('.gpick').forEach(el => {
      el.addEventListener('click', () => {
        const game = el.dataset.game;
        if (picker.id === 'game-picker-create') {
          picker.querySelectorAll('.gpick').forEach(g => g.classList.remove('active'));
          el.classList.add('active');
          selectedGame = game;
        } else if (picker.id === 'game-picker-switch') {
          App.switchGame(game);
          toast('Spel wisselen naar ' + el.textContent + '...');
        }
      });
    });
  });
}

// ===== CHAT =====
function addChatMsg(msg, scroll = true) {
  const container = document.getElementById('chat-messages');
  const div = document.createElement('div');

  if (msg.system) {
    div.className = 'chat-msg sys';
    div.textContent = msg.text;
  } else {
    const isMe = msg.playerId === myId;
    div.className = `chat-msg ${isMe ? 'mine' : ''}`;
    div.innerHTML = `<div class="chat-name">${esc(msg.playerName)}</div><div class="chat-text">${esc(msg.text)}</div>`;
  }

  container.appendChild(div);
  if (scroll) container.scrollTop = container.scrollHeight;

  if (!chatOpen && !msg.system) {
    unread++;
    const dot = document.querySelector('.chat-badge-dot');
    if (dot) dot.classList.add('show');
  }
}

// ===== HELPERS =====
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function toast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => t.classList.remove('show'), 3000);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function isHost() {
  return myRoomState?.players?.find(p => p.id === myId)?.isHost || false;
}

// Add chat badge dot to chat toggle button
document.addEventListener('DOMContentLoaded', () => {
  const btn = document.getElementById('chat-toggle-btn');
  if (btn) {
    const dot = document.createElement('span');
    dot.className = 'chat-badge-dot';
    btn.appendChild(dot);
  }
  initGamePickers();
});

</script>
<script>
// ===== CARDS AGAINST HUMANITY =====
const CAH = {
  render(state) {
    const area = document.getElementById('game-area');
    if (!area) return;

    if (state.phase === 'playing') CAH.renderPlaying(area, state);
    else if (state.phase === 'judging') CAH.renderJudging(area, state);
    else if (state.phase === 'scores') CAH.renderScores(area, state);
    else CAH.renderLobby(area);
  },

  renderCenterLog(state) {
    const entries = (state.log||[]).slice(0, 6);
    if (!entries.length) return '<div class="mcl-title">STRAAT<br>VARIANT</div>';

    // Format log entries nicely - extract name and action
    const fmtLog = (txt) => {
      // Bold player names (first word if it ends with common patterns)
      return esc(txt)
        .replace(/^(🎉|💸|🔒|🏃|👮|🏆|🎲|💰|⚡|📬)/, '<span class="mcl-icon">$1</span>')
        .replace(/€(\d[\d\.,]*)/g, '<span class="mcl-money">€$1</span>');
    };

    return `
      <div class="mcl-title">STRAAT VARIANT</div>
      <div class="mcl-feed">
        ${entries.map((l,i) => `
          <div class="mcl-entry" style="opacity:${1 - i*0.14}">
            ${fmtLog(l)}
          </div>`).join('')}
      </div>
    `;
  },

  renderLobby(area) {
    area.innerHTML = `
      <div class="game-banner" style="background:linear-gradient(135deg,#1a1a1a,#2d2d2d)">
        <div class="game-banner-title" style="color:white">🃏 Cards Against Humanity</div>
        <div class="game-banner-sub">Voor vreselijk slechte mensen. Zoals jij.</div>
      </div>
      <div class="info-box"><h3>Hoe speel je?</h3>
        <p>Één speler is de <strong>Kaart Tsaar</strong>. Die leest een zwarte kaart met een blanco. Iedereen submittet hun grappigste witte kaart. De Tsaar kiest de winnaar. Eerste naar <strong>${myRoomState?.settings?.maxPoints||7} punten</strong> wint.</p>
      </div>
      ${isHost() ? `
        <button class="btn-start-game" onclick="App.startGame()">🚀 Start! (${myRoomState?.players?.length||1} spelers)</button>
        ${(myRoomState?.players?.length||0)<3?'<p class="warn">⚠️ CAH is het leukst met 3+ spelers!</p>':''}
      ` : '<div class="waiting-txt">Wachten op host om te starten...</div>'}
    `;
  },

  renderPlaying(area, state) {
    const isCzar = state.czar === myId;
    const submitted = state.hasSubmitted;
    const submittedCount = state.submittedIds?.length || 0;
    const needed = (myRoomState?.players?.length || 1) - 1;

    area.innerHTML = `
      <div class="cah-topbar">
        <span class="cah-round">Ronde ${state.round}</span>
        <span class="cah-czar">🎩 Tsaar: <strong>${esc(state.czarName)}</strong></span>
        <div class="sc-chips">
          ${Object.entries(state.scores||{}).map(([pid, sc]) => {
            const p = myRoomState?.players?.find(pl=>pl.id===pid);
            return `<span class="sc-chip">${esc(p?.name||'?')}: ${sc}</span>`;
          }).join('')}
        </div>
      </div>
      <div class="black-card">
        <div class="black-card-corner">CAH</div>
        <div class="black-card-text">${esc(state.currentBlack||'')}</div>
        <div class="black-card-pick">Kies 1</div>
      </div>
      ${isCzar ? `
        <div class="czar-box">
          <div style="font-size:2.5rem">👑</div>
          <h3>Jij bent de Kaart Tsaar!</h3>
          <p>Wacht tot iedereen een kaart heeft ingestuurd. Dan kies jij de winnaar.</p>
          <div class="sub-counter">${submittedCount} / ${needed} ingestuurd...</div>
        </div>
      ` : submitted ? `
        <div class="submitted-box">
          <div style="font-size:2.5rem">✅</div>
          <h3>Kaart ingediend!</h3>
          <p>Jouw antwoord: <em>"${esc(state.mySubmission||'')}"</em></p>
          <div class="sub-counter">${submittedCount} / ${needed} ingestuurd...</div>
        </div>
      ` : `
        <div class="hand-label">Kies jouw beste antwoord:</div>
        <div class="white-cards-grid">
          ${(state.myHand||[]).map(card => `

  renderJudging(area, state) {
    const isCzar = state.czar === myId;
    const cards = Object.values(state.submissions || {});
    // Shuffle for anonymity
    const shuffled = [...cards].sort(() => Math.random() - 0.5);

    area.innerHTML = `
      <div class="cah-topbar">
        <span class="cah-round">Ronde ${state.round}</span>
        <span class="cah-czar">🎩 Tsaar: <strong>${esc(state.czarName)}</strong></span>

      <div class="black-card">

      ${isCzar ? `
        <div class="judge-box">
          <h3>👑 Kies de grappigste kaart!</h3>
        </div>
        <div class="judge-grid">
          ${shuffled.map(card => `
            <div class="wcard judge-card" onclick="CAH.pickWinner('${esc(card).replace(/'/g,"\\'")}')">
              <div class="wcard-text">${esc(card)}</div>
              <div class="wcard-brand">🂠</div>
            </div>
          `).join('')}
        </div>
      ` : `
        <div class="czar-box">
          <div style="font-size:2.5rem">🤔</div>
          <h3>Alle kaarten zijn binnen!</h3>
          <p>De Kaart Tsaar kiest de winnaar...</p>
        </div>
        <div class="judge-grid">
          ${shuffled.map(card => `
            <div class="wcard" style="pointer-events:none;opacity:0.8">
              <div class="wcard-text">${esc(card)}</div>
              <div class="wcard-brand">🂠</div>
            </div>
          `).join('')}
        </div>
      `}
    `;
  },

  renderScores(area, state) {
    const maxPts = myRoomState?.settings?.maxPoints || 7;
    const winnerPlayer = myRoomState?.players?.find(p => p.id === state.winner);
    const lastWinnerPlayer = myRoomState?.players?.find(p => p.id === state.lastWinner);

    // Build the full winning combo: black card with answer filled in
    const blackText = state.lastBlackCard || state.currentBlack || '';
    const answer = state.lastWinningCard || '';
    const combo = blackText.includes('___')
      ? blackText.replace('___', `<strong style="color:#ffd93d;font-size:1.15em">${esc(answer)}</strong>`)
      : `${esc(blackText)} <strong style="color:#ffd93d">${esc(answer)}</strong>`;

    area.innerHTML = `
      ${state.winner ? `
        <div class="game-winner">
          <div style="font-size:3.5rem">🏆</div>
          <h2>${esc(winnerPlayer?.name||'?')} WINT HET SPEL!</h2>
          <p style="color:var(--text2);margin-top:0.4rem">Met ${state.scores?.[state.winner]||maxPts} punten.</p>
        </div>
      ` : ''}

      ${state.lastWinner ? `
        <div class="round-winner">
          <div style="font-size:2rem">🎉</div>
          <h3>${esc(lastWinnerPlayer?.name||'?')} wint deze ronde!</h3>
          <div class="cah-combo-card">
            <div class="cah-combo-text">${combo}</div>
          </div>
        </div>
      ` : ''}

      <div style="margin-bottom:0.75rem">
        ${(myRoomState?.players||[])
          .sort((a,b)=>(state.scores?.[b.id]||0)-(state.scores?.[a.id]||0))
          .map(p => `
            <div class="scores-row ${p.id===state.lastWinner?'winner':''}">
              <span class="sc-name">${esc(p.name)}</span>
              <div class="sc-bar-wrap"><div class="sc-bar" style="width:${Math.min(100,((state.scores?.[p.id]||0)/maxPts)*100)}%"></div></div>
              <span class="sc-pts">${state.scores?.[p.id]||0}/${maxPts}</span>
            </div>
          `).join('')}
      </div>
      ${isHost() ? `
        <button class="cah-next-btn" onclick="sendWS({type:'GAME_ACTION',action:'NEXT_ROUND'})">
          ${state.winner ? '🔄 Nieuw Spel' : '➡️ Volgende Ronde'}
        </button>
      ` : '<div class="waiting-txt">Wachten op host...</div>'}
    `;
  },

  submit(el, card) {
    document.querySelectorAll('.wcard').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    setTimeout(() => sendWS({ type: 'GAME_ACTION', action: 'SUBMIT_CARD', card }), 250);
  },

  pickWinner(card) {
    sendWS({ type: 'GAME_ACTION', action: 'PICK_WINNER', card });
  },
};

</script>
<script>
// ===== POKER =====
const Poker = {
  render(state) {
    const area = document.getElementById('game-area');
    if (!area) return;
    if (!state || !state.phase || state.phase === 'waiting') { Poker.renderLobby(area); return; }
    if (state.phase === 'showdown') { Poker.renderShowdown(area, state); return; }
    Poker.renderGame(area, state);
  },

  renderCenterLog(state) {
    const entries = (state.log||[]).slice(0, 6);
    if (!entries.length) return '<div class="mcl-title">STRAAT<br>VARIANT</div>';

    // Format log entries nicely - extract name and action
    const fmtLog = (txt) => {
      // Bold player names (first word if it ends with common patterns)
      return esc(txt)
        .replace(/^(🎉|💸|🔒|🏃|👮|🏆|🎲|💰|⚡|📬)/, '<span class="mcl-icon">$1</span>')
        .replace(/€(\d[\d\.,]*)/g, '<span class="mcl-money">€$1</span>');
    };

    return `
      <div class="mcl-title">STRAAT VARIANT</div>
      <div class="mcl-feed">
        ${entries.map((l,i) => `
          <div class="mcl-entry" style="opacity:${1 - i*0.14}">
            ${fmtLog(l)}
          </div>`).join('')}
      </div>

  },

  renderLobby(area) {
    area.innerHTML = `
      <div class="game-banner" style="background:linear-gradient(135deg,#0a3a0a,#1a5a1a)">
        <div class="game-banner-title" style="color:white">♠️ Texas Hold'em Poker</div>
        <div class="game-banner-sub">Bluf je vrienden arm. Letterlijk.</div>

        <p>Texas Hold'em. Iedereen start met <strong>$1.000</strong>. Small blind $10, big blind $20. Community kaarten na elke betsronde. Beste 5-kaarten hand wint de pot!</p>

    const tokens = ['🚂','🎩','👟','🐕','🚗','⛵'];
    const dealerName = myRoomState?.players?.find(p=>p.id===state.players?.[state.dealerIndex])?.name||'?';

    area.innerHTML = `
      <div class="poker-info">

      <div class="poker-seats">
        ${(state.players||[]).map((pid,i) => {
          const p = myRoomState?.players?.find(pl=>pl.id===pid);
          const chips = state.chips?.[pid]||0;
          const bet = state.bets?.[pid]||0;

            <div class="seat ${folded?'folded':''} ${isCurrent?'active-turn':''}">

              ${folded?'<div class="seat-fold-tag">GEPAST</div>':''}
              ${pid===myId&&hand ? `<div class="my-hole">${hand.map(c=>Poker.card(c)).join('')}</div>` : '<div class="hidden-cards">🂠🂠</div>'}

          <strong id="raise-amt">$${(state.blind||10)*2}</strong>
          <button class="paction pa-raise" onclick="Poker.confirmRaise()" style="flex:0;padding:0.5rem 0.9rem">Raise!</button>
        </div>
      ` : !isFolded ? `<div class="waiting-txt">Wachten op ${esc(state.currentPlayerName||'?')}...</div>` : `<div class="waiting-txt">Je hebt gepast. Volgende keer beter!</div>`}
    `;
  },

  renderShowdown(area, state) {
    const winnerPlayer = myRoomState?.players?.find(p=>p.id===state.winner);
    const tokens = ['🚂','🎩','👟','🐕','🚗','⛵'];
    area.innerHTML = `
      <div class="poker-showdown">
        <div style="font-size:3rem">🏆</div>
        <h3>${esc(winnerPlayer?.name||'?')} wint de pot!</h3>
        ${state.pot===0?`<p style="color:var(--text2)">Pot gewonnen</p>`:''}
      </div>
      <div class="chips-list">
        ${(state.players||[]).map((pid,i)=>{
          const p=myRoomState?.players?.find(pl=>pl.id===pid);
          return `<div class="chip-row"><span>${tokens[i]||'👤'} ${esc(p?.name||'?')}</span><span style="color:var(--accent3);font-weight:800">$${state.chips?.[pid]||0}</span></div>`;
        }).join('')}
      </div>
      ${isHost() ? `<button class="btn-start-game" style="background:linear-gradient(135deg,#2d8a2d,#1a5a1a)" onclick="sendWS({type:'GAME_ACTION',action:'NEXT_HAND'})">🔄 Volgende Hand</button>` : '<div class="waiting-txt">Wachten op host...</div>'}
    `;
  },

  card(c) {
    if (!c) return '';
    const red = c.s==='♥'||c.s==='♦';
    return `<div class="pcard ${red?'red':'black'}"><div class="pcard-r">${c.r}</div><div class="pcard-s">${c.s}</div></div>`;
  },

  showRaise(toCall, myChips, blind) {
    document.getElementById('raise-row')?.classList.toggle('hidden');
  },

  confirmRaise() {
    const amt = parseInt(document.getElementById('raise-slider')?.value || 0);
    sendWS({ type: 'GAME_ACTION', action: 'RAISE', amount: amt });
  },
};

</script>

  {n:'Amstelveen',     t:'prop',     emoji:'🏗️', bg:'#003200'},   // 🟢
  {n:'Snelweg A10',    t:'rr',       emoji:'🚌', bg:'#0a0a28'},
  {n:'Leidseplein',    t:'prop',     emoji:'🌟', bg:'#00001f'},   // 🔷
  {n:'Gemeentebel.',   t:'tax',      emoji:'🏛️', bg:'#220000'},
  {n:'Rembrandtplein', t:'prop',     emoji:'👑', bg:'#00001f'},   // 🔷
];

const LEVEL_NAMES  = ['Leeg','Kraakpand','Rijtjeshuis','Appartement','Villa','Mansion'];
const LEVEL_EMOJI  = ['🏚️','🏠','🏡','🏢','🏰','👑'];
const PLAYER_COLORS = ['#FF6B6B','#4d96ff','#ffd93d','#6bcb77','#b44fff','#ff9f43','#ffffff','#ff4757'];

// Animation state
let monoAnimating = false;
let monoLastState = null;
let monoPendingState = null;

const Mono = {
  render(state) {
    const area = document.getElementById('game-area');
    if (!area) return;
    if (!state || !state.phase) { Mono.renderLobby(area); return; }
    if (state.phase === 'gameover') { Mono.renderGameover(area, state); return; }

    if (monoLastState && !monoAnimating) {
      const allPids = state.players || [];
      const movers = allPids.filter(pid => {
        const op = monoLastState.pos?.[pid];
        const np = state.pos?.[pid];
        return op !== undefined && np !== undefined && op !== np;
      });
      if (movers.length > 0) {
        monoPendingState = state;
        monoAnimating = true;
        // Safety: clear animating state after 15s max to prevent stuck buttons
        const animTimeout = setTimeout(() => { monoAnimating = false; monoLastState = state; Mono.render(state); }, 15000);
        const noPopup = {...state, popup: null, phase: 'animating'};
        // 1. Render board (with dice slots showing "?"), 2. Animate dice, 3. Walk
        const hasFreshDice = state.dice && (!monoLastState.dice ||
          monoLastState.dice[0] !== state.dice[0] || monoLastState.dice[1] !== state.dice[1]);

        const doWalk = () => {
          Mono.renderFull(area, noPopup); // show real dice value
          let pending = movers.length;
          movers.forEach(pid => {
            const fromPos = monoLastState.pos?.[pid] ?? 0;
            const toPos = state.pos[pid];
            Mono.animateSteps(pid, fromPos, toPos, () => {
              pending--;
              if (pending === 0) {
                clearTimeout(animTimeout);
                monoAnimating = false;
                monoLastState = state;
                Mono.render(monoPendingState);
                monoPendingState = null;
              }
            });
          });
        };

        if (hasFreshDice) {
          // Show rolling dice placeholder
          Mono.renderFull(area, {...noPopup, dice: [-1,-1]}); // -1 triggers rolling display
          setTimeout(() => Mono.animateDiceInPlace(state.dice, doWalk), 50);
        } else {
          doWalk();
        }
        return;
      }
    }
    monoLastState = state;
    Mono.renderFull(area, state);
  },

  animateSteps(pid, from, to, onDone) {
    const steps = to >= from ? to - from : (40 - from + to);
    let cur = from;
    let step = 0;
    const delay = Math.max(180, Math.min(300, 2200 / steps)); // slightly slower for better visibility
    const walk = () => {
      cur = (cur + 1) % 40;
      step++;
      Mono.moveToken(pid, cur);
      if (step < steps) {
        setTimeout(walk, delay);
      } else {
        // Flash landing cell
        const cell = document.querySelector(`.mcell[data-sq="${cur}"]`);
        if (cell) {
          cell.classList.add('mcell-land');
          setTimeout(() => cell.classList.remove('mcell-land'), 600);
        }
        setTimeout(onDone, 400);
      }
    };
    setTimeout(walk, 80);
  },

  animateDiceInPlace(finalDice, onDone) {
    const d1 = document.querySelector('.mono-die-1');
    const d2 = document.querySelector('.mono-die-2');
    if (!d1 || !d2) { onDone(); return; }
    const faces = ['⚀','⚁','⚂','⚃','⚄','⚅'];
    let count = 0;
    const totalRolls = 12;
    d1.classList.remove('die-rolling');
    d2.classList.remove('die-rolling');
    const roll = () => {
      count++;
      d1.textContent = faces[Math.floor(Math.random()*6)];
      d2.textContent = faces[Math.floor(Math.random()*6)];
      d1.classList.add('die-spin');
      d2.classList.add('die-spin');
      setTimeout(() => { d1.classList.remove('die-spin'); d2.classList.remove('die-spin'); }, 60);
      if (count < totalRolls) {
        const delay = 60 + count * 10; // gets slightly slower
        setTimeout(roll, delay);
      } else {
        // Land!
        d1.textContent = faces[finalDice[0]-1];
        d2.textContent = faces[finalDice[1]-1];
        d1.classList.add('die-land');
        d2.classList.add('die-land');
        // Show sum
        const sumEl = document.querySelector('.mono-dsum');

  },

  moveToken(pid, sqIdx) {

    // Remove token from all cells
    document.querySelectorAll(`.mt-${safeId}`).forEach(e => e.remove());

    let wrap = cell.querySelector('.mcell-tokens');
    if (!wrap) { wrap = document.createElement('div'); wrap.className = 'mcell-tokens'; cell.appendChild(wrap); }

    const pi = realPlayers.indexOf(pid);
    const pname = myRoomState?.players?.find(p=>p.id===pid)?.name || '?';
    const tok = document.createElement('div');
    tok.className = `mtoken mt-${safeId}${pid===myId?' mtoken-me':''}`;
    tok.style.background = isc ? '#ffd93d' : (PLAYER_COLORS[pi] || '#888');
    tok.style.color = isc ? '#111' : 'white';
    tok.textContent = isc ? '👮' : pname.charAt(0).toUpperCase();

    tok.classList.add('tok-flash');
    setTimeout(() => tok.classList.remove('tok-flash'), 200);
  },

  dieFace(n) {
    return ['','⚀','⚁','⚂','⚃','⚄','⚅'][n]||n;
  },

  renderBoardHTML(state) {
    // 11x11 grid, 40 border squares clockwise from sq0(bottom-right)
    // Mapping: sq → {r, c} where r=0=top, r=10=bottom, c=0=left, c=10=right
    // START = bottom-LEFT (r10,c0), clockwise:
    // Bottom row L→R, right col B→T, top row R→L, left col T→B
    const pos = {};
    // Bottom row LEFT→RIGHT: sq0(r10,c0) ... sq9(r10,c9)
    for(let i=0;i<=9;i++) pos[i] = {r:10, c:i};
    // Bottom-right corner: sq10 = r10,c10 (JAIL)
    pos[10] = {r:10, c:10};
    // Right col BOTTOM→TOP: sq11(r9,c10) ... sq19(r1,c10)
    for(let i=0;i<=8;i++) pos[11+i] = {r:9-i, c:10};
    // Top-right corner: sq20 = r0,c10 (FREE PARKING)
    pos[20] = {r:0, c:10};
    // Top row RIGHT→LEFT: sq21(r0,c9) ... sq29(r0,c1)
    for(let i=0;i<=8;i++) pos[21+i] = {r:0, c:9-i};
    // Top-left corner: sq30 = r0,c0 (GO TO JAIL)
    pos[30] = {r:0, c:0};
    // Left col TOP→BOTTOM: sq31(r1,c0) ... sq39(r9,c0)
    for(let i=0;i<=8;i++) pos[31+i] = {r:1+i, c:0};

    // Build grid lookup
    const grid = {};
    Object.entries(pos).forEach(([sq,{r,c}]) => grid[r+'_'+c] = parseInt(sq));

    const realPlayers = state.realPlayers || state.players || [];
    let html = '';
    for(let r=0;r<=10;r++) {
      for(let c=0;c<=10;c++) {
        const sqIdx = grid[r+'_'+c];
        if(sqIdx === undefined) {
          html += '<div class="mcell mcell-inner"></div>';
          continue;
        }
        const sq = MONO_BOARD_CLIENT[sqIdx] || {n:'?',t:'?',emoji:'?',bg:'#111'};
        const prop = state.props?.[sqIdx];
        const ownerRealIdx = prop ? realPlayers.indexOf(prop.ownerId) : -1;
        const streetCol = SQ_COLOR[sqIdx];
        const isCorner = [0,10,20,30].includes(sqIdx);

        // Who's here?
        const here = (state.players||[]).filter(pid => (state.pos?.[pid]||0) === sqIdx);

        html += `<div class="mcell${isCorner?' mcell-corner':''} mcell-${sq.t}" style="background:${sq.bg||'#111'}" data-sq="${sqIdx}" title="${sq.n}${sq.desc?' — '+sq.desc:''}">`;

        // Color stripe at top for street groups
        if(streetCol) html += `<div class="mcell-stripe" style="background:${streetCol}"></div>`;

        // Ownership glow
        if(prop && ownerRealIdx>=0) {
          html += `<div class="mcell-own-glow" style="box-shadow:inset 0 0 0 2px ${PLAYER_COLORS[ownerRealIdx]}88"></div>`;
        }

        html += `<div class="mcell-body">`;
        html += `<div class="mcell-emoji">${sq.emoji}</div>`;
        if(!isCorner) html += `<div class="mcell-label">${sq.n.split(' ')[0]}</div>`;
        if(prop?.level>0) html += `<div class="mcell-lvl">${LEVEL_EMOJI[prop.level]}</div>`;
        html += `</div>`;

        // Token layer - always present for JS to inject into
        html += `<div class="mcell-tokens">`;
        here.forEach(pid => {
          const isc = pid==='cop';
          const pi = realPlayers.indexOf(pid);
          const pname = myRoomState?.players?.find(p=>p.id===pid)?.name||'?';
          const safeId = pid.replace(/[^a-z0-9]/gi,'_');
          html += `<div class="mtoken mt-${safeId}${pid===myId?' mtoken-me':''}" 
            style="background:${isc?'#ffd93d':PLAYER_COLORS[pi]||'#888'};color:${isc?'#111':'white'}"
            title="${isc?'Agent 👮':pname}">
            ${isc?'👮':pname.charAt(0).toUpperCase()}
          </div>`;
        });
        html += `</div>`;

        html += '</div>';
      }
    }
    return html;
  },

  renderSidebar(state) {

    const isCopTurn = state.current === 'cop';
    return `

      .filter(([,p])=>p.ownerId===myId)
      .map(([idx,p])=>({idx:parseInt(idx),level:p.level,sq:MONO_BOARD_CLIENT[parseInt(idx)]}));

    return `<div class="mono-props">

      <div class="mono-props-grid">
        ${myProps.map(({idx,level,sq})=>{
          const upgCost = Math.floor((sq.p||1000)*0.5);
          const col = SQ_COLOR[idx]||'#4d96ff';
          return `<div class="mpcard" style="border-top:3px solid ${col}">

            ${level<5 && state.current===myId && !state.rolled
              ? `<button class="mpcard-upg" onclick="sendWS({type:'GAME_ACTION',action:'UPGRADE',sqIdx:${idx}})">⬆️ €${upgCost.toLocaleString('nl')}</button>`
              : `<div class="mpcard-rent">Huur: €${Mono.calcRent(idx,state).toLocaleString('nl')}</div>`}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  },

  calcRent(sqIdx, state) {
    const sq = MONO_BOARD_CLIENT[sqIdx];
    const prop = state.props?.[sqIdx];
    if(!prop) return 0;
    if(sq.t==='rr') {
      const cnt = Object.entries(state.props||{}).filter(([i,p])=>MONO_BOARD_CLIENT[i]?.t==='rr'&&p.ownerId===prop.ownerId).length;
      return [0,250,500,1000,2000][cnt]||250;
    }
    if(sq.t==='util') return (state.lastDiceSum||7)*40;
    const mults=[1,2,4,8,14,20];
    return Math.round(((MONO_BOARD_CLIENT[sqIdx]?.r)||10)*(mults[prop.level]||1));
  },

      </div>
      <div style="display:flex;flex-direction:column;gap:0.5rem;margin-bottom:1.5rem">
        ${[...realPlayers].sort((a,b)=>(state.money?.[b]||0)-(state.money?.[a]||0)).map((pid,rank)=>{
          const p=myRoomState?.players?.find(pl=>pl.id===pid);
          const i=realPlayers.indexOf(pid);
          const medals=['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣'];
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:0.75rem;background:#1a1a2e;border-radius:10px;border-left:4px solid ${PLAYER_COLORS[i]}">
            <span>${medals[rank]||''} ${esc(p?.name||'?')}</span>
            <span style="color:#6bcb77;font-weight:900;font-family:Bangers,cursive;font-size:1.1rem">€${(state.money?.[pid]||0).toLocaleString('nl')}</span>
          </div>`;
        }).join('')}
      </div>
      ${isHost()?`<button class="btn-start-game" onclick="App.startGame()">🔄 Nieuw Spel</button>`:'<div class="waiting-txt">Wachten op host...</div>'}
    `;
  },
};

function monoGetName(state, pid) {
  if(pid==='cop') return 'Agent 👮';
  return myRoomState?.players?.find(p=>p.id===pid)?.name||'?';
}

</script>
