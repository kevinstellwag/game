<script>

// ===== CARDS AGAINST HUMANITY =====
const CAH = {
  render(state) {
    const area = document.getElementById('game-area');
    if (!area) return;

    if (state.phase === 'playing') CAH.renderPlaying(area, state);
    else if (state.phase === 'judging') CAH.renderJudging(area, state);
    else if (state.phase === 'scores') CAH.renderScores(area, state);
    else CAH.renderLobby(area);
  },

  renderLobby(area) {
    area.innerHTML = `
      <div class="game-banner" style="background:linear-gradient(135deg,#1a1a1a,#2d2d2d)">
        <div class="game-banner-title" style="color:white">🃏 Cards Against Humanity</div>
        <div class="game-banner-sub">Voor vreselijk slechte mensen. Zoals jij.</div>
      </div>
      <div class="info-box"><h3>Hoe speel je?</h3>
        <p>Één speler is de <strong>Kaart Tsaar</strong>. Die leest een zwarte kaart met een blanco. Iedereen submittet hun grappigste witte kaart. De Tsaar kiest de winnaar. Eerste naar <strong>${myRoomState?.settings?.maxPoints||7} punten</strong> wint.</p>
      </div>
      ${isHost() ? `
        <button class="btn-start-game" onclick="App.startGame()">🚀 Start! (${myRoomState?.players?.length||1} spelers)</button>
        ${(myRoomState?.players?.length||0)<3?'<p class="warn">⚠️ CAH is het leukst met 3+ spelers!</p>':''}
      ` : '<div class="waiting-txt">Wachten op host om te starten...</div>'}
    `;
  },

  renderPlaying(area, state) {
    const isCzar = state.czar === myId;
    const submitted = state.hasSubmitted;
    const submittedCount = state.submittedIds?.length || 0;
    const needed = (myRoomState?.players?.length || 1) - 1;

    area.innerHTML = `
      <div class="cah-topbar">
        <span class="cah-round">Ronde ${state.round}</span>
        <span class="cah-czar">🎩 Tsaar: <strong>${esc(state.czarName)}</strong></span>
        <div class="sc-chips">
          ${Object.entries(state.scores||{}).map(([pid, sc]) => {
            const p = myRoomState?.players?.find(pl=>pl.id===pid);
            return `<span class="sc-chip">${esc(p?.name||'?')}: ${sc}</span>`;
          }).join('')}
        </div>
      </div>
      <div class="black-card">
        <div class="black-card-corner">CAH</div>
        <div class="black-card-text">${esc(state.currentBlack||'')}</div>
        <div class="black-card-pick">Kies 1</div>
      </div>
      ${isCzar ? `
        <div class="czar-box">
          <div style="font-size:2.5rem">👑</div>
          <h3>Jij bent de Kaart Tsaar!</h3>
          <p>Wacht tot iedereen een kaart heeft ingestuurd. Dan kies jij de winnaar.</p>
          <div class="sub-counter">${submittedCount} / ${needed} ingestuurd...</div>
        </div>
      ` : submitted ? `
        <div class="submitted-box">
          <div style="font-size:2.5rem">✅</div>
          <h3>Kaart ingediend!</h3>
          <p>Jouw antwoord: <em>"${esc(state.mySubmission||'')}"</em></p>
          <div class="sub-counter">${submittedCount} / ${needed} ingestuurd...</div>
        </div>
      ` : `
        <div class="hand-label">Kies jouw beste antwoord:</div>
        <div class="white-cards-grid">
          ${(state.myHand||[]).map(card => `
            <div class="wcard" onclick="CAH.submit(this, '${esc(card).replace(/'/g,"\\'")}')">
              <div class="wcard-text">${esc(card)}</div>
              <div class="wcard-brand">🂠</div>
            </div>
          `).join('')}
        </div>
      `}
    `;
  },

  renderJudging(area, state) {
    const isCzar = state.czar === myId;
    const cards = Object.values(state.submissions || {});
    // Shuffle for anonymity
    const shuffled = [...cards].sort(() => Math.random() - 0.5);

    area.innerHTML = `
      <div class="cah-topbar">
        <span class="cah-round">Ronde ${state.round}</span>
        <span class="cah-czar">🎩 Tsaar: <strong>${esc(state.czarName)}</strong></span>
      </div>
      <div class="black-card">
        <div class="black-card-corner">CAH</div>
        <div class="black-card-text">${esc(state.currentBlack||'')}</div>
      </div>
      ${isCzar ? `
        <div class="judge-box">
          <h3>👑 Kies de grappigste kaart!</h3>
        </div>
        <div class="judge-grid">
          ${shuffled.map(card => `
            <div class="wcard judge-card" onclick="CAH.pickWinner('${esc(card).replace(/'/g,"\\'")}')">
              <div class="wcard-text">${esc(card)}</div>
              <div class="wcard-brand">🂠</div>
            </div>
          `).join('')}
        </div>
      ` : `
        <div class="czar-box">
          <div style="font-size:2.5rem">🤔</div>
          <h3>Alle kaarten zijn binnen!</h3>
          <p>De Kaart Tsaar kiest de winnaar...</p>
        </div>
        <div class="judge-grid">
          ${shuffled.map(card => `
            <div class="wcard" style="pointer-events:none;opacity:0.8">
              <div class="wcard-text">${esc(card)}</div>
              <div class="wcard-brand">🂠</div>
            </div>
          `).join('')}
        </div>
      `}
    `;
  },

  renderScores(area, state) {
    const maxPts = myRoomState?.settings?.maxPoints || 7;
    const winnerPlayer = myRoomState?.players?.find(p => p.id === state.winner);
    const lastWinnerPlayer = myRoomState?.players?.find(p => p.id === state.lastWinner);

    // Build the full winning combo: black card with answer filled in
    const blackText = state.lastBlackCard || state.currentBlack || '';
    const answer = state.lastWinningCard || '';
    const combo = blackText.includes('___')
      ? blackText.replace('___', `<strong style="color:#ffd93d;font-size:1.15em">${esc(answer)}</strong>`)
      : `${esc(blackText)} <strong style="color:#ffd93d">${esc(answer)}</strong>`;

    area.innerHTML = `
      ${state.winner ? `
        <div class="game-winner">
          <div style="font-size:3.5rem">🏆</div>
          <h2>${esc(winnerPlayer?.name||'?')} WINT HET SPEL!</h2>
          <p style="color:var(--text2);margin-top:0.4rem">Met ${state.scores?.[state.winner]||maxPts} punten.</p>
        </div>
      ` : ''}

      ${state.lastWinner ? `
        <div class="round-winner">
          <div style="font-size:2rem">🎉</div>
          <h3>${esc(lastWinnerPlayer?.name||'?')} wint deze ronde!</h3>
          <div class="cah-combo-card">
            <div class="cah-combo-text">${combo}</div>
          </div>
        </div>
      ` : ''}

      <div style="margin-bottom:0.75rem">
        ${(myRoomState?.players||[])
          .sort((a,b)=>(state.scores?.[b.id]||0)-(state.scores?.[a.id]||0))
          .map(p => `
            <div class="scores-row ${p.id===state.lastWinner?'winner':''}">
              <span class="sc-name">${esc(p.name)}</span>
              <div class="sc-bar-wrap"><div class="sc-bar" style="width:${Math.min(100,((state.scores?.[p.id]||0)/maxPts)*100)}%"></div></div>
              <span class="sc-pts">${state.scores?.[p.id]||0}/${maxPts}</span>
            </div>
          `).join('')}
      </div>
      ${isHost() ? `
        <button class="cah-next-btn" onclick="sendWS({type:'GAME_ACTION',action:'NEXT_ROUND'})">
          ${state.winner ? '🔄 Nieuw Spel' : '➡️ Volgende Ronde'}
        </button>
      ` : '<div class="waiting-txt">Wachten op host...</div>'}
      <div style="text-align:center;margin-top:0.75rem">
        <button class="btn-sm" onclick="Account.openScreen()" style="font-size:0.8rem">📊 Leaderboard bekijken</button>
      </div>
    `;
  },

  submit(el, card) {
    document.querySelectorAll('.wcard').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    setTimeout(() => sendWS({ type: 'GAME_ACTION', action: 'SUBMIT_CARD', card }), 250);
  },

  pickWinner(card) {
    sendWS({ type: 'GAME_ACTION', action: 'PICK_WINNER', card });
  },
};

</script>
<script>

// ===== POKER =====
const Poker = {
  render(state) {
    const area = document.getElementById('game-area');
    if (!area) return;
    if (!state || !state.phase || state.phase === 'waiting') { Poker.renderLobby(area); return; }
    if (state.phase === 'showdown') { Poker.renderShowdown(area, state); return; }
    Poker.renderGame(area, state);
  },

  renderCenterLog(state) {
    const entries = (state.log||[]).slice(0, 6);
    if (!entries.length) return '<div class="mcl-title">STRAAT<br>VARIANT</div>';

    // Format log entries nicely - extract name and action
    const fmtLog = (txt) => {
      // Bold player names (first word if it ends with common patterns)
      return esc(txt)
        .replace(/^(🎉|💸|🔒|🏃|👮|🏆|🎲|💰|⚡|📬)/, '<span class="mcl-icon">$1</span>')
        .replace(/€(\d[\d\.,]*)/g, '<span class="mcl-money">€$1</span>');
    };

    return `
      <div class="mcl-title">STRAAT VARIANT</div>
      <div class="mcl-feed">
        ${entries.map((l,i) => `
          <div class="mcl-entry" style="opacity:${1 - i*0.14}">
            ${fmtLog(l)}
          </div>`).join('')}
      </div>
    `;
  },

  renderLobby(area) {
    area.innerHTML = `
      <div class="game-banner" style="background:linear-gradient(135deg,#0a3a0a,#1a5a1a)">
        <div class="game-banner-title" style="color:white">♠️ Texas Hold'em Poker</div>
        <div class="game-banner-sub">Bluf je vrienden arm. Letterlijk.</div>
      </div>
      <div class="info-box"><h3>Hoe speel je?</h3>
        <p>Texas Hold'em. Iedereen start met <strong>$1.000</strong>. Small blind $10, big blind $20. Community kaarten na elke betsronde. Beste 5-kaarten hand wint de pot!</p>
      </div>
      <div class="info-box"><h3>Spelers</h3>
        ${(myRoomState?.players||[]).map((p,i)=>`<div style="padding:0.3rem 0">${['🚂','🎩','👟','🐕','🚗','⛵'][i]||'👤'} ${esc(p.name)} — $1.000 ${p.isHost?'👑':''}</div>`).join('')}
      </div>
      ${isHost() ? `
        <button class="btn-start-game" style="background:linear-gradient(135deg,#2d8a2d,#1a5a1a)" onclick="App.startGame()">♠️ Deal Cards!</button>
        ${(myRoomState?.players?.length||0)<2?'<p class="warn">⚠️ Poker heeft minstens 2 spelers nodig!</p>':''}
      ` : '<div class="waiting-txt">Wachten op host om te dealen...</div>'}
    `;
  },

  renderGame(area, state) {
    const myHand = state.myHand?.[myId] || state.myHand || [];
    const isMyTurn = state.players?.[state.currentPlayerIndex] === myId;
    const isFolded = state.folded?.[myId];
    const myBet = state.bets?.[myId] || 0;
    const myChips = state.chips?.[myId] || 0;
    const toCall = Math.max(0, (state.currentBet||0) - myBet);
    const tokens = ['🚂','🎩','👟','🐕','🚗','⛵'];
    const dealerName = myRoomState?.players?.find(p=>p.id===state.players?.[state.dealerIndex])?.name||'?';

    area.innerHTML = `
      <div class="poker-info">
        <strong>${(state.phase||'').toUpperCase()}</strong>
        <span>💰 Pot: <strong>$${state.pot||0}</strong></span>
        <span>🎯 Dealer: ${esc(dealerName)}</span>
        ${isMyTurn&&!isFolded ? '<span class="your-turn-pill">JOUW BEURT!</span>' : ''}
      </div>

      <div class="community-box">
        <div class="community-label">Community Cards</div>
        <div class="cards-row">
          ${(state.community||[]).map(c=>Poker.card(c)).join('')}
          ${Array.from({length:5-(state.community?.length||0)},()=>'<div class="pcard pcard-back">🂠</div>').join('')}
        </div>
      </div>

      <div class="poker-seats">
        ${(state.players||[]).map((pid,i) => {
          const p = myRoomState?.players?.find(pl=>pl.id===pid);
          const chips = state.chips?.[pid]||0;
          const bet = state.bets?.[pid]||0;
          const folded = state.folded?.[pid];
          const isCurrent = state.players[state.currentPlayerIndex]===pid;
          const hand = pid===myId ? (Array.isArray(myHand)?myHand:[]) : null;
          return `
            <div class="seat ${folded?'folded':''} ${isCurrent?'active-turn':''}">
              <div class="seat-name">${tokens[i]||'👤'} ${esc(p?.name||'?')} ${pid===myId?'<span style="color:var(--accent4)">(jij)</span>':''}</div>
              <div class="seat-chips">$${chips}</div>
              <div class="seat-bet">${bet>0?`inzet: $${bet}`:''}</div>
              ${folded?'<div class="seat-fold-tag">GEPAST</div>':''}
              ${pid===myId&&hand ? `<div class="my-hole">${hand.map(c=>Poker.card(c)).join('')}</div>` : '<div class="hidden-cards">🂠🂠</div>'}
            </div>
          `;
        }).join('')}
      </div>

      ${isMyTurn && !isFolded ? `
        <div class="poker-actions">
          <button class="paction pa-fold" onclick="sendWS({type:'GAME_ACTION',action:'FOLD'})">🚫 Passen</button>
          ${toCall===0 ? `<button class="paction pa-check" onclick="sendWS({type:'GAME_ACTION',action:'CHECK'})">✋ Check</button>` : ''}
          ${toCall>0 ? `<button class="paction pa-call" onclick="sendWS({type:'GAME_ACTION',action:'CALL'})">📲 Callen $${toCall}</button>` : ''}
          ${myChips>toCall ? `<button class="paction pa-raise" onclick="Poker.showRaise(${toCall}, ${myChips}, ${state.blind||10})">📈 Raisen</button>` : ''}
        </div>
        <div class="raise-row hidden" id="raise-row">
          <span>Raise:</span>
          <input type="range" id="raise-slider" min="${(state.blind||10)*2}" max="${Math.max((state.blind||10)*2, myChips-toCall)}" step="${state.blind||10}" value="${(state.blind||10)*2}" oninput="document.getElementById('raise-amt').textContent='$'+this.value">
          <strong id="raise-amt">$${(state.blind||10)*2}</strong>
          <button class="paction pa-raise" onclick="Poker.confirmRaise()" style="flex:0;padding:0.5rem 0.9rem">Raise!</button>
        </div>
      ` : !isFolded ? `<div class="waiting-txt">Wachten op ${esc(state.currentPlayerName||'?')}...</div>` : `<div class="waiting-txt">Je hebt gepast. Volgende keer beter!</div>`}
    `;
  },

  renderShowdown(area, state) {
    const winnerPlayer = myRoomState?.players?.find(p=>p.id===state.winner);
    const tokens = ['🚂','🎩','👟','🐕','🚗','⛵'];
    area.innerHTML = `
      <div class="poker-showdown">
        <div style="font-size:3rem">🏆</div>
        <h3>${esc(winnerPlayer?.name||'?')} wint de pot!</h3>
        ${state.pot===0?`<p style="color:var(--text2)">Pot gewonnen</p>`:''}
      </div>
      <div class="chips-list">
        ${(state.players||[]).map((pid,i)=>{
          const p=myRoomState?.players?.find(pl=>pl.id===pid);
          return `<div class="chip-row"><span>${tokens[i]||'👤'} ${esc(p?.name||'?')}</span><span style="color:var(--accent3);font-weight:800">$${state.chips?.[pid]||0}</span></div>`;
        }).join('')}
      </div>
      ${isHost() ? `<button class="btn-start-game" style="background:linear-gradient(135deg,#2d8a2d,#1a5a1a)" onclick="sendWS({type:'GAME_ACTION',action:'NEXT_HAND'})">🔄 Volgende Hand</button>` : '<div class="waiting-txt">Wachten op host...</div>'}
    `;
  },

  card(c) {
    if (!c) return '';
    const red = c.s==='♥'||c.s==='♦';
    return `<div class="pcard ${red?'red':'black'}"><div class="pcard-r">${c.r}</div><div class="pcard-s">${c.s}</div></div>`;
  },

  showRaise(toCall, myChips, blind) {
    document.getElementById('raise-row')?.classList.toggle('hidden');
  },

  confirmRaise() {
    const amt = parseInt(document.getElementById('raise-slider')?.value || 0);
    sendWS({ type: 'GAME_ACTION', action: 'RAISE', amount: amt });
  },
};

</script>
<script>

// ===== MONOPOLY =====
// Board: sq0=START(bottom-right), clockwise:
//   sq0-9:   bottom row RIGHT→LEFT
//   sq10:    JAIL bottom-left corner
//   sq11-19: left col BOTTOM→TOP
//   sq20:    FREE PARKING top-left corner
//   sq21-29: top row LEFT→RIGHT
//   sq30:    GO TO JAIL top-right corner
//   sq31-39: right col TOP→BOTTOM

// Color groups — match server sq indices exactly
const STREET_COLORS = {
  brown:  { hex:'#8B4513', name:'Bruin',        streets:[1,3]     },
  lblue:  { hex:'#00BFFF', name:'Lichtblauw',   streets:[6,8,9]   },
  pink:   { hex:'#FF69B4', name:'Roze',          streets:[11,13,14]},
  orange: { hex:'#FF8C00', name:'Oranje',        streets:[16,18,19]},
  red:    { hex:'#CC2200', name:'Rood',          streets:[21,23,24]},
  yellow: { hex:'#FFD700', name:'Geel',          streets:[26,28,29]},
  green:  { hex:'#2E8B57', name:'Groen',         streets:[31,33,35]},
  dblue:  { hex:'#3333CC', name:'Donkerblauw',   streets:[37,39]   },
};

const SQ_COLOR = {};
Object.values(STREET_COLORS).forEach(({hex,streets}) => streets.forEach(s => SQ_COLOR[s] = hex));

const MONO_BOARD_CLIENT = [
  // sq0  START           ── bottom-left corner
  {n:'START',          t:'go',       emoji:'🏁', bg:'#0a2a0a'},
  // sq1-9  bottom row left→right
  {n:'Crack Steeg',    t:'prop',     emoji:'🏚️', bg:'#221005'},   // 🟤
  {n:'Gemeentekas',    t:'chest',    emoji:'📬', bg:'#001525'},
  {n:'Jordaan Slop',   t:'prop',     emoji:'🏠', bg:'#221005'},   // 🟤
  {n:'Belasting',      t:'tax',      emoji:'⚡', bg:'#220000'},
  {n:'Schiphol',       t:'rr',       emoji:'✈️', bg:'#0a0a28'},
  {n:'AH Straat',      t:'prop',     emoji:'🛒', bg:'#002035'},   // 🔵
  {n:'Kans',           t:'chance',   emoji:'🎲', bg:'#181500'},
  {n:'Wallen Wijk',    t:'prop',     emoji:'🪟', bg:'#002035'},   // 🔵
  {n:'Coffeeshop',     t:'prop',     emoji:'☕', bg:'#002035'},   // 🔵
  // sq10 JAIL           ── bottom-right corner
  {n:'Gevangenis',     t:'jail',     emoji:'🔒', bg:'#0a0a22'},
  // sq11-19  right col bottom→top
  {n:'Kattenburgh',    t:'prop',     emoji:'🐱', bg:'#28001a'},   // 🩷
  {n:'Waterleiding',   t:'util',     emoji:'💧', bg:'#002020'},
  {n:'Kinkerstraat',   t:'prop',     emoji:'🛵', bg:'#28001a'},   // 🩷
  {n:'De Pijp',        t:'prop',     emoji:'🥐', bg:'#28001a'},   // 🩷
  {n:'Centraal',       t:'rr',       emoji:'🚂', bg:'#0a0a28'},
  {n:'NDSM Loods',     t:'prop',     emoji:'🏭', bg:'#221200'},   // 🟠
  {n:'Gemeentekas',    t:'chest',    emoji:'📬', bg:'#001525'},
  {n:'Zuidas Tower',   t:'prop',     emoji:'🏢', bg:'#221200'},   // 🟠
  {n:'Vondelpark',     t:'prop',     emoji:'🌳', bg:'#221200'},   // 🟠
  // sq20 FREE PARKING   ── top-right corner
  {n:'Gratis P.',      t:'free',     emoji:'🚗', bg:'#002800'},
  // sq21-29  top row right→left
  {n:'Herengracht',    t:'prop',     emoji:'🏰', bg:'#280000'},   // 🔴
  {n:'Kans',           t:'chance',   emoji:'🎲', bg:'#181500'},
  {n:'Keizersgracht',  t:'prop',     emoji:'🏯', bg:'#280000'},   // 🔴
  {n:'Prinsengracht',  t:'prop',     emoji:'🏛️', bg:'#280000'},   // 🔴
  {n:'Zuid-As Metro',  t:'rr',       emoji:'🚇', bg:'#0a0a28'},
  {n:'Museumplein',    t:'prop',     emoji:'🎨', bg:'#222200'},   // 🟡
  {n:'Luxebelasting',  t:'tax',      emoji:'💸', bg:'#220000'},
  {n:'Oud-Zuid',       t:'prop',     emoji:'🏡', bg:'#222200'},   // 🟡
  {n:'Vondelweg',      t:'prop',     emoji:'🌿', bg:'#222200'},   // 🟡
  // sq30 GA NAAR BAK    ── top-left corner
  {n:'Naar Bak',       t:'gotojail', emoji:'🚔', bg:'#220000'},
  // sq31-39  left col top→bottom
  {n:'Apollolaan',     t:'prop',     emoji:'🌴', bg:'#003200'},   // 🟢
  {n:'Gemeentekas',    t:'chest',    emoji:'📬', bg:'#001525'},
  {n:'Buitenveldert',  t:'prop',     emoji:'🏘️', bg:'#003200'},   // 🟢
  {n:'Kans',           t:'chance',   emoji:'🎲', bg:'#181500'},
  {n:'Amstelveen',     t:'prop',     emoji:'🏗️', bg:'#003200'},   // 🟢
  {n:'Snelweg A10',    t:'rr',       emoji:'🚌', bg:'#0a0a28'},
  {n:'Leidseplein',    t:'prop',     emoji:'🌟', bg:'#00001f'},   // 🔷
  {n:'Gemeentebel.',   t:'tax',      emoji:'🏛️', bg:'#220000'},
  {n:'Rembrandtplein', t:'prop',     emoji:'👑', bg:'#00001f'},   // 🔷
];

const LEVEL_NAMES  = ['Leeg','Kraakpand','Rijtjeshuis','Appartement','Villa','Mansion'];
const LEVEL_EMOJI  = ['🏚️','🏠','🏡','🏢','🏰','👑'];
const PLAYER_COLORS = ['#FF6B6B','#4d96ff','#ffd93d','#6bcb77','#b44fff','#ff9f43','#ffffff','#ff4757'];

// Animation state
let monoAnimating = false;
let monoLastState = null;
let monoPendingState = null;

const Mono = {
  render(state) {
    const area = document.getElementById('game-area');
    if (!area) return;
    if (!state || !state.phase) { Mono.renderLobby(area); return; }
    if (state.phase === 'gameover') { Mono.renderGameover(area, state); return; }

    if (monoLastState && !monoAnimating) {
      const allPids = state.players || [];
      const movers = allPids.filter(pid => {
        const op = monoLastState.pos?.[pid];
        const np = state.pos?.[pid];
        return op !== undefined && np !== undefined && op !== np;
      });
      if (movers.length > 0) {
        monoPendingState = state;
        monoAnimating = true;
        // Safety: clear animating state after 15s max to prevent stuck buttons
        const animTimeout = setTimeout(() => { monoAnimating = false; monoLastState = state; Mono.render(state); }, 15000);
        const noPopup = {...state, popup: null, phase: 'animating'};
        // 1. Render board (with dice slots showing "?"), 2. Animate dice, 3. Walk
        const hasFreshDice = state.dice && (!monoLastState.dice ||
          monoLastState.dice[0] !== state.dice[0] || monoLastState.dice[1] !== state.dice[1]);

        const doWalk = () => {
          Mono.renderFull(area, noPopup); // show real dice value
          let pending = movers.length;
          movers.forEach(pid => {
            const fromPos = monoLastState.pos?.[pid] ?? 0;
            const toPos = state.pos[pid];
            Mono.animateSteps(pid, fromPos, toPos, () => {
              pending--;
              if (pending === 0) {
                clearTimeout(animTimeout);
                monoAnimating = false;
                monoLastState = state;
                Mono.render(monoPendingState);
                monoPendingState = null;
              }
            });
          });
        };

        if (hasFreshDice) {
          // Show rolling dice placeholder
          Mono.renderFull(area, {...noPopup, dice: [-1,-1]}); // -1 triggers rolling display
          setTimeout(() => Mono.animateDiceInPlace(state.dice, doWalk), 50);
        } else {
          doWalk();
        }
        return;
      }
    }
    monoLastState = state;
    Mono.renderFull(area, state);
  },

  animateSteps(pid, from, to, onDone) {
    const steps = to >= from ? to - from : (40 - from + to);
    let cur = from;
    let step = 0;
    const delay = Math.max(180, Math.min(300, 2200 / steps)); // slightly slower for better visibility
    const walk = () => {
      cur = (cur + 1) % 40;
      step++;
      Mono.moveToken(pid, cur);
      if (step < steps) {
        setTimeout(walk, delay);
      } else {
        // Flash landing cell
        const cell = document.querySelector(`.mcell[data-sq="${cur}"]`);
        if (cell) {
          cell.classList.add('mcell-land');
          setTimeout(() => cell.classList.remove('mcell-land'), 600);
        }
        setTimeout(onDone, 400);
      }
    };
    setTimeout(walk, 80);
  },

  animateDiceInPlace(finalDice, onDone) {
    const d1 = document.querySelector('.mono-die-1');
    const d2 = document.querySelector('.mono-die-2');
    if (!d1 || !d2) { onDone(); return; }
    const faces = ['⚀','⚁','⚂','⚃','⚄','⚅'];
    let count = 0;
    const totalRolls = 12;
    d1.classList.remove('die-rolling');
    d2.classList.remove('die-rolling');
    const roll = () => {
      count++;
      d1.textContent = faces[Math.floor(Math.random()*6)];
      d2.textContent = faces[Math.floor(Math.random()*6)];
      d1.classList.add('die-spin');
      d2.classList.add('die-spin');
      setTimeout(() => { d1.classList.remove('die-spin'); d2.classList.remove('die-spin'); }, 60);
      if (count < totalRolls) {
        const delay = 60 + count * 10; // gets slightly slower
        setTimeout(roll, delay);
      } else {
        // Land!
        d1.textContent = faces[finalDice[0]-1];
        d2.textContent = faces[finalDice[1]-1];
        d1.classList.add('die-land');
        d2.classList.add('die-land');
        // Show sum
        const sumEl = document.querySelector('.mono-dsum');
        if (sumEl) { sumEl.textContent = '= ' + (finalDice[0]+finalDice[1]); sumEl.style.color='#ffd93d'; }
        setTimeout(onDone, 500); // pause to see the result before walking
      }
    };
    roll();
  },

  moveToken(pid, sqIdx) {
    const isc = pid === 'cop';
    const safeId = pid.replace(/[^a-z0-9]/gi,'_');
    // Remove token from all cells
    document.querySelectorAll(`.mt-${safeId}`).forEach(e => e.remove());
    // Add to new cell
    const cell = document.querySelector(`.mcell[data-sq="${sqIdx}"]`);
    if (!cell) return;
    let wrap = cell.querySelector('.mcell-tokens');
    if (!wrap) { wrap = document.createElement('div'); wrap.className = 'mcell-tokens'; cell.appendChild(wrap); }
    const realPlayers = monoLastState?.realPlayers || monoLastState?.players || [];
    const pi = realPlayers.indexOf(pid);
    const pname = myRoomState?.players?.find(p=>p.id===pid)?.name || '?';
    const tok = document.createElement('div');
    tok.className = `mtoken mt-${safeId}${pid===myId?' mtoken-me':''}`;
    tok.style.background = isc ? '#ffd93d' : (PLAYER_COLORS[pi] || '#888');
    tok.style.color = isc ? '#111' : 'white';
    tok.textContent = isc ? '👮' : pname.charAt(0).toUpperCase();
    tok.title = isc ? 'Agent' : pname;
    wrap.appendChild(tok);
    // Flash
    tok.classList.add('tok-flash');
    setTimeout(() => tok.classList.remove('tok-flash'), 200);
  },

  renderFull(area, state) {
    const isMyTurn = state.current === myId;
    const myMoney = state.money?.[myId] || 0;
    const inJail = state.jail?.[myId];
    const hasFreePass = state.freePass?.[myId];
    const realPlayers = state.realPlayers || state.players || [];

    area.innerHTML = `
      <div class="mono-topbar">
        <div class="mono-tb-left">
          ${state.dice && state.dice[0] !== -1
            ? `<span class="mono-die mono-die-1">${Mono.dieFace(state.dice[0])}</span>
               <span class="mono-die mono-die-2">${Mono.dieFace(state.dice[1])}</span>
               <span class="mono-dsum">= ${state.dice[0]+state.dice[1]}</span>`
            : state.dice && state.dice[0] === -1
              ? `<span class="mono-die mono-die-1 die-rolling">🎲</span>
                 <span class="mono-die mono-die-2 die-rolling">🎲</span>
                 <span class="mono-dsum" style="color:#888">...</span>`
              : '<span class="mono-noroll">🎲 niet gegooid</span>'}
        </div>
        <div class="mono-tb-mid">
          ${state.current==='cop'
            ? `<span class="cop-pill">👮 Agent rijdt...</span>`
            : isMyTurn
              ? `<span class="turn-pill">🎮 JOUW BEURT!</span>`
              : `<span class="wait-pill">⏳ ${esc(monoGetName(state,state.current))}</span>`}
        </div>
        <div class="mono-tb-right">
          <span class="my-money">€${myMoney.toLocaleString('nl')}</span>
          ${hasFreePass?'<span class="badge-fp">🗝️</span>':''}
          ${inJail?'<span class="badge-jail">🔒</span>':''}
        </div>
      </div>

      <div class="mono-layout">
        <div class="mono-board-wrap">
          <div class="mono-board" id="mono-board">
            ${Mono.renderBoardHTML(state)}
          </div>
          <div class="mono-center-log" id="mono-center-log">
            ${Mono.renderCenterLog(state)}
          </div>
        </div>
        <div class="mono-sidebar">
          ${Mono.renderSidebar(state)}
        </div>
      </div>

      ${Mono.renderMyProps(state)}
      ${isMyTurn && state.phase !== 'gameover' && state.phase !== 'spin_result' ? Mono.renderActions(state) : ''}


      ${state.popup && state.phase!=='animating'
        ? `<div class="mono-overlay"><div class="mono-overlay-inner">${Mono.renderPopup(state)}</div></div>` : ''}
      ${state.phase==='spin_result'
        ? `<div class="mono-overlay"><div class="mono-overlay-inner">${Mono.renderSpinResult(state)}</div></div>` : ''}
    `;
  },

  dieFace(n) {
    return ['','⚀','⚁','⚂','⚃','⚄','⚅'][n]||n;
  },

  renderBoardHTML(state) {
    // 11x11 grid, 40 border squares clockwise from sq0(bottom-right)
    // Mapping: sq → {r, c} where r=0=top, r=10=bottom, c=0=left, c=10=right
    // START = bottom-LEFT (r10,c0), clockwise:
    // Bottom row L→R, right col B→T, top row R→L, left col T→B
    const pos = {};
    // Bottom row LEFT→RIGHT: sq0(r10,c0) ... sq9(r10,c9)
    for(let i=0;i<=9;i++) pos[i] = {r:10, c:i};
    // Bottom-right corner: sq10 = r10,c10 (JAIL)
    pos[10] = {r:10, c:10};
    // Right col BOTTOM→TOP: sq11(r9,c10) ... sq19(r1,c10)
    for(let i=0;i<=8;i++) pos[11+i] = {r:9-i, c:10};
    // Top-right corner: sq20 = r0,c10 (FREE PARKING)
    pos[20] = {r:0, c:10};
    // Top row RIGHT→LEFT: sq21(r0,c9) ... sq29(r0,c1)
    for(let i=0;i<=8;i++) pos[21+i] = {r:0, c:9-i};
    // Top-left corner: sq30 = r0,c0 (GO TO JAIL)
    pos[30] = {r:0, c:0};
    // Left col TOP→BOTTOM: sq31(r1,c0) ... sq39(r9,c0)
    for(let i=0;i<=8;i++) pos[31+i] = {r:1+i, c:0};

    // Build grid lookup
    const grid = {};
    Object.entries(pos).forEach(([sq,{r,c}]) => grid[r+'_'+c] = parseInt(sq));

    const realPlayers = state.realPlayers || state.players || [];
    let html = '';
    for(let r=0;r<=10;r++) {
      for(let c=0;c<=10;c++) {
        const sqIdx = grid[r+'_'+c];
        if(sqIdx === undefined) {
          html += '<div class="mcell mcell-inner"></div>';
          continue;
        }
        const sq = MONO_BOARD_CLIENT[sqIdx] || {n:'?',t:'?',emoji:'?',bg:'#111'};
        const prop = state.props?.[sqIdx];
        const ownerRealIdx = prop ? realPlayers.indexOf(prop.ownerId) : -1;
        const streetCol = SQ_COLOR[sqIdx];
        const isCorner = [0,10,20,30].includes(sqIdx);

        // Who's here?
        const here = (state.players||[]).filter(pid => (state.pos?.[pid]||0) === sqIdx);

        html += `<div class="mcell${isCorner?' mcell-corner':''} mcell-${sq.t}" style="background:${sq.bg||'#111'}" data-sq="${sqIdx}" title="${sq.n}${sq.desc?' — '+sq.desc:''}">`;

        // Color stripe at top for street groups
        if(streetCol) html += `<div class="mcell-stripe" style="background:${streetCol}"></div>`;

        // Ownership glow
        if(prop && ownerRealIdx>=0) {
          html += `<div class="mcell-own-glow" style="box-shadow:inset 0 0 0 2px ${PLAYER_COLORS[ownerRealIdx]}88"></div>`;
        }

        html += `<div class="mcell-body">`;
        html += `<div class="mcell-emoji">${sq.emoji}</div>`;
        if(!isCorner) html += `<div class="mcell-label">${sq.n.split(' ')[0]}</div>`;
        if(prop?.level>0) html += `<div class="mcell-lvl">${LEVEL_EMOJI[prop.level]}</div>`;
        html += `</div>`;

        // Token layer - always present for JS to inject into
        html += `<div class="mcell-tokens">`;
        here.forEach(pid => {
          const isc = pid==='cop';
          const pi = realPlayers.indexOf(pid);
          const pname = myRoomState?.players?.find(p=>p.id===pid)?.name||'?';
          const safeId = pid.replace(/[^a-z0-9]/gi,'_');
          html += `<div class="mtoken mt-${safeId}${pid===myId?' mtoken-me':''}" 
            style="background:${isc?'#ffd93d':PLAYER_COLORS[pi]||'#888'};color:${isc?'#111':'white'}"
            title="${isc?'Agent 👮':pname}">
            ${isc?'👮':pname.charAt(0).toUpperCase()}
          </div>`;
        });
        html += `</div>`;

        html += '</div>';
      }
    }
    return html;
  },

  renderSidebar(state) {
    const realPlayers = state.realPlayers || state.players || [];
    const isCopTurn = state.current === 'cop';
    return `
      <div class="ms-title">🏦 STRAAT</div>
      <div class="ms-players">
        ${realPlayers.map((pid,i) => {
          const p = myRoomState?.players?.find(pl=>pl.id===pid);
          const money = state.money?.[pid]||0;
          const inJail = state.jail?.[pid];
          const bankrupt = state.bankrupt?.[pid];
          const isCurrent = state.current === pid;
          return `<div class="ms-player${bankrupt?' ms-bankrupt':''}${pid===myId?' ms-me':''}">
            <div class="ms-tok" style="background:${PLAYER_COLORS[i]};${isCurrent?'box-shadow:0 0 0 2px white':''}">
              ${(p?.name||'?').charAt(0).toUpperCase()}
            </div>
            <div class="ms-info">
              <div class="ms-name">${esc(p?.name||'?')}${inJail?' 🔒':''}${bankrupt?' 💀':''}</div>
              <div class="ms-cash">€${money.toLocaleString('nl')}</div>
            </div>
          </div>`;
        }).join('')}
        <div class="ms-player${isCopTurn?' ms-current':''}">
          <div class="ms-tok ms-cop">👮</div>
          <div class="ms-info">
            <div class="ms-name" style="color:#ffd93d">Agent NPC</div>
            <div class="ms-cash" style="color:#666">vak ${state.pos?.cop||0}</div>
          </div>
        </div>
      </div>
      <div class="ms-colors">
        ${Object.entries(STREET_COLORS).map(([,{hex,name,streets}])=>`
          <div class="ms-col-row">
            <span class="ms-col-dot" style="background:${hex}"></span>
            <span class="ms-col-name">${name}</span>
          </div>`).join('')}
      </div>
    `;
  },

  renderMyProps(state) {
    const myProps = Object.entries(state.props||{})
      .filter(([,p])=>p.ownerId===myId)
      .map(([idx,p])=>({idx:parseInt(idx),level:p.level,sq:MONO_BOARD_CLIENT[parseInt(idx)]}));
    if(!myProps.length) return '';
    return `<div class="mono-props">
      <div class="mono-props-hdr">Jouw panden</div>
      <div class="mono-props-grid">
        ${myProps.map(({idx,level,sq})=>{
          const upgCost = Math.floor((sq.p||1000)*0.5);
          const col = SQ_COLOR[idx]||'#4d96ff';
          return `<div class="mpcard" style="border-top:3px solid ${col}">
            <div class="mpcard-top">${sq.emoji} <span>${sq.n}</span></div>
            <div class="mpcard-level">${LEVEL_EMOJI[level]} ${LEVEL_NAMES[level]}</div>
            ${level<5 && state.current===myId && !state.rolled
              ? `<button class="mpcard-upg" onclick="sendWS({type:'GAME_ACTION',action:'UPGRADE',sqIdx:${idx}})">⬆️ €${upgCost.toLocaleString('nl')}</button>`
              : `<div class="mpcard-rent">Huur: €${Mono.calcRent(idx,state).toLocaleString('nl')}</div>`}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  },

  calcRent(sqIdx, state) {
    const sq = MONO_BOARD_CLIENT[sqIdx];
    const prop = state.props?.[sqIdx];
    if(!prop) return 0;
    if(sq.t==='rr') {
      const cnt = Object.entries(state.props||{}).filter(([i,p])=>MONO_BOARD_CLIENT[i]?.t==='rr'&&p.ownerId===prop.ownerId).length;
      return [0,250,500,1000,2000][cnt]||250;
    }
    if(sq.t==='util') return (state.lastDiceSum||7)*40;
    const mults=[1,2,4,8,14,20];
    return Math.round(((MONO_BOARD_CLIENT[sqIdx]?.r)||10)*(mults[prop.level]||1));
  },

  renderActions(state) {
    const inJail = state.jail?.[myId];
    const hasFreePass = state.freePass?.[myId];
    return `<div class="mono-actions">
      ${!state.rolled ? `
        ${hasFreePass&&inJail?`<button class="mact mact-fp" onclick="sendWS({type:'GAME_ACTION',action:'USE_FREE_PASS'})">🗝️ Vrijpas gebruiken</button>`:''}
        <button class="mact mact-roll" onclick="sendWS({type:'GAME_ACTION',action:'ROLL'})">🎲 Gooi de dobbelstenen!</button>
      ` : `
        <button class="mact mact-end" onclick="sendWS({type:'GAME_ACTION',action:'END_TURN'})">➡️ Beurt beëindigen</button>
      `}
    </div>`;
  },

  renderPopup(state) {
    const pop = state.popup;
    if(!pop) return '';
    const isMyTurn = state.current === myId;
    const sq = pop.sq || MONO_BOARD_CLIENT[pop.sqIdx] || {};
    const col = SQ_COLOR[pop.sqIdx] || '#4d96ff';

    if(pop.kind==='buy_card') {
      const canAfford = (state.money?.[myId]||0) >= (sq.p||99999);
      return `<div class="popup buy-popup" style="--pop-color:${col}">
        <div class="pop-stripe" style="background:${col}"></div>
        <div class="pop-emoji">${sq.emoji||'🏠'}</div>
        <div class="pop-title">${esc(sq.n||'')}</div>
        <div class="pop-desc">${esc(sq.desc||'')}</div>
        <div class="pop-stats">
          <div class="pop-stat">💰 Prijs <strong>€${(sq.p||0).toLocaleString('nl')}</strong></div>
          <div class="pop-stat">📋 Basishuur <strong>€${(sq.r||250).toLocaleString('nl')}</strong></div>
        </div>
        ${sq.t==='prop'?`<div class="pop-upgrades">${LEVEL_EMOJI.map((e,i)=>`<span title="${LEVEL_NAMES[i]}">${e}</span>`).join('→')}</div>`:''}
        ${isMyTurn?`<div class="pop-btns">
          ${canAfford
            ?`<button class="pbtn pbtn-buy" onclick="sendWS({type:'GAME_ACTION',action:'BUY'})">🏠 Kopen! €${(sq.p||0).toLocaleString('nl')}</button>`
            :`<p class="pop-warn">⚠️ Niet genoeg geld (€${(state.money?.[myId]||0).toLocaleString('nl')})</p>`}
          <button class="pbtn pbtn-skip" onclick="sendWS({type:'GAME_ACTION',action:'CLOSE_POPUP'})">⏭️ Niet kopen</button>
        </div>`:'<div class="pop-wait">Wachten op speler...</div>'}
      </div>`;
    }

    if(pop.kind==='rent_card') {
      return `<div class="popup rent-popup">
        <div class="pop-stripe" style="background:#ff6b6b"></div>
        <div class="pop-emoji">${sq.emoji||'🏠'}</div>
        <div class="pop-title">HUUR BETALEN!</div>
        <div class="pop-desc">${esc(sq.n||'')} — eigenaar: <strong>${esc(pop.ownerName||'?')}</strong></div>
        <div class="pop-big-price">€${(pop.rent||0).toLocaleString('nl')}</div>
        ${isMyTurn?`<div class="pop-btns">
          <button class="pbtn pbtn-dash" onclick="sendWS({type:'GAME_ACTION',action:'DASH'})">🏃 DASH! <small>30% kans</small></button>
          <button class="pbtn pbtn-pay" onclick="sendWS({type:'GAME_ACTION',action:'PAY_RENT'})">💸 Betaal €${(pop.rent||0).toLocaleString('nl')}</button>
        </div>
        <p class="pop-note">Dash mislukt = dubbel (€${((pop.rent||0)*2).toLocaleString('nl')})</p>`
        :'<div class="pop-wait">Wachten op speler...</div>'}
      </div>`;
    }

    if(pop.kind==='chance_card') return `<div class="popup chance-popup">
      <div class="pop-stripe" style="background:#ffd93d"></div>
      <div class="pop-emoji">🎲</div>
      <div class="pop-title">KANS!</div>
      <div class="pop-cardtext">${esc(pop.card?.txt||'')}</div>
      ${isMyTurn?`<button class="pbtn pbtn-ok" onclick="sendWS({type:'GAME_ACTION',action:'CLOSE_POPUP'})">✓ OK!</button>`:'<div class="pop-wait">Wachten...</div>'}
    </div>`;

    if(pop.kind==='chest_card') return `<div class="popup chest-popup">
      <div class="pop-stripe" style="background:#4d96ff"></div>
      <div class="pop-emoji">📬</div>
      <div class="pop-title">GEMEENTEKAS!</div>
      <div class="pop-cardtext">${esc(pop.card?.txt||'')}</div>
      ${isMyTurn?`<button class="pbtn pbtn-ok" onclick="sendWS({type:'GAME_ACTION',action:'CLOSE_POPUP'})">✓ OK!</button>`:'<div class="pop-wait">Wachten...</div>'}
    </div>`;

    if(pop.kind==='jail_card') return `<div class="popup jail-popup">
      <div class="pop-stripe" style="background:#ff4444"></div>
      <div class="pop-emoji">🔒</div>
      <div class="pop-title">DE BAK IN!</div>
      <div class="pop-cardtext">Geen €2.000. Gooi dubbel om vrij te komen (max 3x, anders €1.500 borgtocht).</div>
      ${isMyTurn?`<button class="pbtn pbtn-ok" onclick="sendWS({type:'GAME_ACTION',action:'CLOSE_POPUP'})">😤 Prima dan</button>`:'<div class="pop-wait">Wachten...</div>'}
    </div>`;

    if(pop.kind==='tax_card') return `<div class="popup tax-popup">
      <div class="pop-stripe" style="background:#ff8c00"></div>
      <div class="pop-emoji">${pop.sq?.emoji||'💸'}</div>
      <div class="pop-title">${esc(pop.sq?.n||'BELASTING')}</div>
      <div class="pop-big-price" style="color:#ff6b6b">-€${(pop.sq?.a||0).toLocaleString('nl')}</div>
      ${isMyTurn?`<button class="pbtn pbtn-ok" onclick="sendWS({type:'GAME_ACTION',action:'CLOSE_POPUP'})">😭 Oké</button>`:'<div class="pop-wait">Wachten...</div>'}
    </div>`;

    if(pop.kind==='spin_intro') return `<div class="popup spin-intro-popup">
      <div class="pop-stripe" style="background:#ffd93d"></div>
      <div class="pop-emoji">🚔</div>
      <div class="pop-title">AGENT NAAST JE!</div>
      <div class="pop-cardtext"><strong>${(pop.victims||[]).map(v=>esc(v)).join(' & ')}</strong> moet het rad draaien!</div>
      ${isMyTurn
        ?`<button class="pbtn pbtn-spin" onclick="sendWS({type:'GAME_ACTION',action:'SPIN_WHEEL'})">🎡 DRAAI HET RAD!</button>`
        :'<div class="pop-wait">Wachten op actieve speler...</div>'}
    </div>`;

    return '';
  },

  renderSpinResult(state) {
    const r = state.spinResult;
    if(!r) return '';
    const cols = {free:'#6bcb77',fine:'#ff6b6b',jail:'#ff0000',chase:'#ff9f43'};
    const icons = {free:'🎉',fine:'💸',jail:'🔒',chase:'🏃'};
    return `<div class="popup spin-result-popup" style="border-top:5px solid ${cols[r.type]||'#fff'}">
      <div class="pop-big-icon">${icons[r.type]||'❓'}</div>
      <div class="pop-title" style="color:${cols[r.type]||'#fff'}">${esc(r.txt||'')}</div>
      ${myId===state.current
        ?`<button class="pbtn pbtn-ok" onclick="sendWS({type:'GAME_ACTION',action:'CLOSE_SPIN'})">OK</button>`
        :'<div class="pop-wait">Wachten op speler...</div>'}
    </div>`;
  },

  renderCenterLog(state) {
    const entries = (state.log||[]).slice(0, 6);
    if (!entries.length) return '<div class="mcl-title">STRAAT<br>VARIANT</div>';

    // Format log entries nicely - extract name and action
    const fmtLog = (txt) => {
      // Bold player names (first word if it ends with common patterns)
      return esc(txt)
        .replace(/^(🎉|💸|🔒|🏃|👮|🏆|🎲|💰|⚡|📬)/, '<span class="mcl-icon">$1</span>')
        .replace(/€(\d[\d\.,]*)/g, '<span class="mcl-money">€$1</span>');
    };

    return `
      <div class="mcl-title">STRAAT VARIANT</div>
      <div class="mcl-feed">
        ${entries.map((l,i) => `
          <div class="mcl-entry" style="opacity:${1 - i*0.14}">
            ${fmtLog(l)}
          </div>`).join('')}
      </div>
    `;
  },

  renderLobby(area) {
    area.innerHTML = `
      <div class="game-banner" style="background:linear-gradient(135deg,#071407,#0d1f0d)">
        <div class="game-banner-title" style="color:#6bcb77">🏦 STRAAT VARIANT</div>
        <div class="game-banner-sub">Van Crack Steeg tot Rembrandtplein. €15.000 startkapitaal.</div>
      </div>
      <div class="info-box">
        <h3>Spelregels</h3>
        <p>Koop straten en upgrade van 🏚️ <em>Kraakpand</em> tot 👑 <em>Mansion</em>. Passeer START = <strong>€2.000</strong>. Een <strong>NPC Agent 👮</strong> rijdt na elke ronde — land hij op jou? Rad draaien! Op andermans pand? <strong>DASH</strong> (30% ontsnapping, anders dubbele huur).</p>
      </div>
      <div class="info-box">
        <h3>Spelers</h3>
        ${(myRoomState?.players||[]).map((p,i)=>`
          <div class="lobby-player-row">
            <div class="lp-avatar" style="background:${PLAYER_COLORS[i]}">${(p.name||'?').charAt(0).toUpperCase()}</div>
            <div class="lp-name">${esc(p.name)} ${p.id===myId?'<span style="color:#4d96ff">(jij)</span>':''} ${p.isHost?'👑':''}</div>
          </div>`).join('')}
        <div class="lobby-player-row" style="border-top:1px solid #ffd93d33;margin-top:0.4rem;padding-top:0.4rem">
          <div class="lp-avatar" style="background:#ffd93d;color:#111">👮</div>
          <div class="lp-name" style="color:#ffd93d">Agent <span style="background:#ffd93d22;color:#ffd93d;border-radius:20px;padding:0.1rem 0.5rem;font-size:0.7rem;margin-left:0.3rem">NPC</span></div>
        </div>
      </div>
      ${isHost()
        ?`<button class="btn-start-game" style="background:linear-gradient(135deg,#228b22,#0a4a0a)" onclick="App.startGame()">🎲 Start! (€15.000 startkapitaal)</button>`
        :'<div class="waiting-txt">Wachten op host...</div>'}
    `;
  },

  renderGameover(area, state) {
    const winner = myRoomState?.players?.find(p=>p.id===state.winner);
    const realPlayers = state.realPlayers||state.players||[];
    area.innerHTML = `
      <div style="text-align:center;padding:2rem 1rem">
        <div style="font-size:4rem;animation:bounce 0.6s ease">🏆</div>
        <h2 style="font-family:Bangers,cursive;font-size:2.5rem;letter-spacing:3px;color:#ffd93d">${esc(winner?.name||'?')} WINT!</h2>
        <p style="color:#8888aa;margin:0.5rem 0 1.5rem">De rijkste straatvechter van Amsterdam.</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:0.5rem;margin-bottom:1.5rem">
        ${[...realPlayers].sort((a,b)=>(state.money?.[b]||0)-(state.money?.[a]||0)).map((pid,rank)=>{
          const p=myRoomState?.players?.find(pl=>pl.id===pid);
          const i=realPlayers.indexOf(pid);
          const medals=['🥇','🥈','🥉','4️⃣','5️⃣','6️⃣','7️⃣','8️⃣'];
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:0.75rem;background:#1a1a2e;border-radius:10px;border-left:4px solid ${PLAYER_COLORS[i]}">
            <span>${medals[rank]||''} ${esc(p?.name||'?')}</span>
            <span style="color:#6bcb77;font-weight:900;font-family:Bangers,cursive;font-size:1.1rem">€${(state.money?.[pid]||0).toLocaleString('nl')}</span>
          </div>`;
        }).join('')}
      </div>
      ${isHost()?`<button class="btn-start-game" onclick="App.startGame()">🔄 Nieuw Spel</button>`:'<div class="waiting-txt">Wachten op host...</div>'}
    `;
  },
};

function monoGetName(state, pid) {
  if(pid==='cop') return 'Agent 👮';
  return myRoomState?.players?.find(p=>p.id===pid)?.name||'?';
}

</script>
</body></html>
